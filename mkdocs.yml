site_name: YAFFO!
site_description: A photo organization tool with EXIF, face recognition, and duplicate detection.
site_url: https://yaffo.app/
repo_url: https://github.com/Jason-Turan0/yaffo
repo_name: Jason-Turan0/yaffo
docs_dir: docs
# MkDocs skips dot-directories by default. Keep that, except for .well-known,
# which serves Microsoft's publisher-domain file for the OneDrive sign-in app.
exclude_docs: |
  .*
  !.well-known/
  /templates/
copyright: Copyright &copy; Jason Turan

theme:
  name: material
  # Use the system font stack, matching the app's --font-body (and dropping the
  # Google Fonts dependency Material pulls in by default).
  font: false
  logo: assets/yaffo-mark.svg
  favicon: assets/yaffo-mark.svg
  features:
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: yaffo
      accent: yaffo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: yaffo
      accent: yaffo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - glightbox

extra_css:
  - stylesheets/extra.css
  - stylesheets/guide-walkthrough.css
  - stylesheets/annotated-screenshot.css
  - stylesheets/guide-decisions.css

extra_javascript:
  - javascripts/guide-walkthrough.js
  - javascripts/annotated-screenshot.js
  - javascripts/guide-decisions.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - User Guide:
      - Start Here:
          - Getting Started: guide/start-here/getting-started.md
          - Concepts and Glossary: guide/start-here/concepts.md
          - Ask Yaffo: guide/start-here/ask-yaffo.md
      - Library Basics:
          - Indexing & Library Management: guide/library-basics/indexing-library.md
          - Browsing, Filtering, and Search: guide/library-basics/browsing-filtering.md
          - Photo Details: guide/library-basics/photo-details.md
          - Organizing Photos: guide/library-basics/organizing-photos.md
      - Organize & Review:
          - Faces & People: guide/organize-review/faces-and-people.md
          - Assigning Faces: guide/organize-review/assigning-faces.md
          - Labels and Auto-Classification: guide/organize-review/labels.md
          - Locations & Map: guide/organize-review/locations.md
          - Finding Duplicates: guide/organize-review/duplicates.md
      - Create & Customize:
          - Custom Pages: guide/create-customize/custom-pages.md
          - Themes: guide/create-customize/themes.md
          - Automations: guide/create-customize/automations.md
          - Importing Photos: guide/create-customize/importing.md
          - Exporting Photos: guide/create-customize/exporting.md
          - Creating a Photo Service: guide/create-customize/photo-services.md
      - Reference & Maintenance:
          - Settings Reference: guide/reference-maintenance/settings.md
          - Comparison: guide/reference-maintenance/comparison.md
          - Troubleshooting: guide/reference-maintenance/troubleshooting.md
          - Uninstalling Yaffo: guide/reference-maintenance/uninstalling.md
  - Privacy: privacy.md
