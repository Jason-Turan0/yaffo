site_name: Yaffo
site_description: A photo organization tool with EXIF, face recognition, and duplicate detection.
site_url: https://jason-turan0.github.io/yaffo/
repo_url: https://github.com/Jason-Turan0/yaffo
repo_name: Jason-Turan0/yaffo
docs_dir: docs
copyright: Copyright &copy; Jason Turan

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - User Guide:
      - Start Here:
          - Getting Started: guide/start-here/getting-started.md
          - Concepts and Glossary: guide/start-here/concepts.md
      - Library Basics:
          - Indexing & Library Management: guide/library-basics/indexing-library.md
          - Browsing, Filtering, and Search: guide/library-basics/browsing-filtering.md
          - Photo Details: guide/library-basics/photo-details.md
          - Organizing Photos: guide/library-basics/organizing-photos.md
      - Organize & Review:
          - Faces & People: guide/organize-review/faces-and-people.md
          - Labels and Auto-Classification: guide/organize-review/labels.md
          - Locations & Map: guide/organize-review/locations.md
          - Finding Duplicates: guide/organize-review/duplicates.md
      - Create & Customize:
          - Custom Pages: guide/create-customize/custom-pages.md
          - Themes: guide/create-customize/themes.md
          - Automations: guide/create-customize/automations.md
      - Reference & Maintenance:
          - Settings Reference: guide/reference-maintenance/settings.md
          - Troubleshooting: guide/reference-maintenance/troubleshooting.md
          - Uninstalling Yaffo: guide/reference-maintenance/uninstalling.md
