feature: settings
description: User can configure media directories, the thumbnail directory, language and units, classification labels, and view system information

tags:
  - core

preconditions:
  - Application is running

context:
  - tag: settings-template
    path: templates/settings/index.html
    description: Settings page — media dirs, thumbnail dir, language, units, labels, LLM, system info
  - tag: settings-routes
    path: routes/settings.py
    description: Routes for media dirs, thumbnail stats/dir, locale, distance unit, labels, and LLM config
  - tag: settings-js
    path: static/settings/index.js
    description: Client wiring for adding/removing media dirs and streaming thumbnail stats
  - tag: responsive-nav-js
    path: static/nav.js
    description: Narrow-screen Menu and the peer page-panel contract (moves/restores live panel DOM)
  - tag: responsive-nav-panel-template
    path: templates/components/nav_panel.html
    description: Declares a page panel and its peer navbar button; the registration contract
  - tag: responsive-shell
    path: static/responsive.css
    description: Shared adaptive layout; owns the narrow-screen rules every page inherits

data:
  - Removing the last media directory should be allowed but leaves indexing with nothing to scan
  - Changing the language re-renders the UI text in the chosen locale

scenarios:
  - name: settings_add_media_directory
    goal: The user can add a media directory
    priority: high
    steps:
      - Navigate to the settings page
      - Enter a valid directory path into the new media directory field
      - Click the "Add Directory" button
    verify:
      - The new directory appears in the Media Directories list
      - A success message is displayed
      - Entering an empty path shows a validation error instead of adding
    cleanup:
      - Remove the media directory that was added

  - name: settings_remove_media_directory
    goal: The user can remove a media directory after confirming
    priority: high
    steps:
      - Navigate to the settings page
      - Click Remove on one of the listed media directories
      - Confirm the removal in the confirmation dialog
    verify:
      - A confirmation dialog is shown before removing
      - After confirming, the directory disappears from the Media Directories list
      - A success message is displayed
      # The "No media directories configured" empty state requires removing the
      # seeded library directory, which the parallel suites depend on — not asserted.
      # Tests add their own scratch directory and remove that one.

  - name: settings_change_language
    goal: Changing the application language re-renders the UI in that locale
    priority: high
    steps:
      - Navigate to the settings page
      - Select a different language from the "Application language" selector
    verify:
      - The page reloads/updates and visible UI text is shown in the selected language
      - The selected language remains chosen after navigating to another page
    cleanup:
      - Restore the language back to the original value

  - name: settings_change_distance_unit
    goal: The user can switch the preferred distance unit
    priority: medium
    steps:
      - Navigate to the settings page
      - Change the "Preferred distance unit" selector
    verify:
      - The distance unit preference is saved and survives a reload
      # Distance rendering elsewhere (locations, automation distance fields) reads
      # the preference live; asserting it would couple this suite to those pages,
      # so persistence is the verified contract.
    cleanup:
      - Restore the original distance unit

  - name: settings_change_thumbnail_directory
    goal: The user can move the thumbnail directory to a new location
    priority: medium
    steps:
      - Navigate to the settings page
      - Enter a new thumbnail directory path
      - Click "Change Directory" / "Set Directory"
      - Confirm the move when prompted with the file count and size
    verify:
      - The thumbnail stats (file count and total size) stream in and populate
      - The confirmation dialog shows how many files and how much data will move
      - After confirming, the Current Thumbnail Directory updates to the new path
      - A success message is displayed
    cleanup:
      - Restore the thumbnail directory to the original path

  - name: settings_manage_classification_labels
    goal: The user can edit the image-classification label vocabulary
    priority: medium
    steps:
      - Navigate to the settings page
      - Add a new classification label to the vocabulary
      - Save the labels
    verify:
      - The new label appears in the label vocabulary
      - A success message is displayed
      - A removed label no longer appears in the vocabulary
    cleanup:
      - Remove the label that was added

  - name: settings_system_information_displayed
    goal: The System Information section shows environment and model paths
    priority: low
    steps:
      - Navigate to the settings page
      - Scroll to the System Information section
    verify:
      - Build Version and Build Timestamp are displayed
      - Database Path and Task Queue Database Path are shown
      - ExifTool, FFmpeg, Face Recognition, and Image Classification model paths are listed (or "Not found")
  # ---------------------------------------------------------------------------
  # Responsive coverage (P7 — settings). The shared shell contract itself is verified
  # in specs/photo_gallery.yaml; what follows is this family's own narrow-screen
  # behaviour. Shared helpers: generated_tests/_support/responsive.ts.
  # ---------------------------------------------------------------------------
  - name: settings_long_paths_wrap_instead_of_widening_the_page
    goal: Filesystem paths and API keys stay inside the viewport
    priority: high
    steps:
      - Load the settings page at 320x568
    verify:
      - System and current path values wrap anywhere rather than overflowing
      - The page does not scroll horizontally
      - Destructive actions stay visually distinct from the rest once the rows stack
  - name: settings_folder_picker_fits_a_narrow_viewport
    goal: The shared folder/file picker is usable on a narrow screen
    priority: high
    steps:
      - Load the settings page at 390x844 and open a folder picker
      - Press Escape
    verify:
      - The picker fits inside the viewport with an edge gutter
      - The entry list scrolls inside itself using dynamic viewport units and contains its own overscroll
      - Long paths in the picker bar wrap or ellipsise rather than widening the dialog
      - Escape closes the picker
