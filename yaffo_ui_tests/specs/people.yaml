feature: people
description: User can manage people — list, add, edit, delete, and review the faces assigned to each person

tags:
  - smoke
  - core

preconditions:
  - Application is running
  - Database contains sample photos with detected faces

context:
  - tag: people-list-template
    path: templates/people/list.html
    description: People listing with add/edit/delete actions and per-person face/photo counts
  - tag: person-faces-template
    path: templates/people/faces.html
    description: Per-person faces view with the ability to unassign faces
  - tag: people-routes
    path: routes/people.py
    description: Routes for people CRUD, api person create, and per-person face removal
  - tag: face_assignment
    attribute: yaffo-face_assignment
    description: Shared context — people are the assignment target for detected faces
  - tag: responsive-nav-js
    path: static/nav.js
    description: Narrow-screen Menu and the peer page-panel contract (moves/restores live panel DOM)
  - tag: responsive-nav-panel-template
    path: templates/components/nav_panel.html
    description: Declares a page panel and its peer navbar button; the registration contract
  - tag: responsive-shell
    path: static/responsive.css
    description: Shared adaptive layout; owns the narrow-screen rules every page inherits

data:
  - The Bennett seed creates Marcus Bennett, Elena Bennett, Maya Bennett, and Theo Bennett
  - Maya Bennett has birthdate 2014-09-12 and Theo Bennett has birthdate 2017-11-15; the parents have no seeded birthdate
  - A newly created person starts with zero faces and zero photos
  - The Bennett seed leaves unassigned faces available for people-management scenarios
  - Tests dynamically avoid the active similarity cluster used by the parallel face_assignment suite
  - Gender options are Male, Female, and Not specified

scenarios:
  - name: people_list_displays_all_people
    goal: The people page lists every person with their name, face count, and photo count
    priority: high
    steps:
      - Navigate to the people page
    verify:
      - The People heading is visible
      - Each person row shows a name, a Faces count, and a Photos count
      - Each person row exposes Edit and Delete actions
      # The "No people yet" empty state requires zero people in the database;
      # concurrent suites (face_assignment) create people mid-run, so it is not
      # asserted deterministically.

  - name: people_can_add_new_person
    goal: The user can create a new person with a name, birthdate, and gender
    priority: high
    steps:
      - Navigate to the people page
      - Click the "Add Person" button
      - In the modal enter the name "SpecTestPerson"
      - Set a birthdate and select a gender
      - Submit the add-person form
    verify:
      - The add-person modal opens with Name, Birthdate, and Gender fields
      - After saving, "SpecTestPerson" appears in the people list
      - A success message is displayed
    cleanup:
      - Delete the person "SpecTestPerson"

  - name: people_can_edit_person
    goal: The user can rename a person and change their details
    priority: high
    steps:
      - Create a person named "SpecTestPerson" if needed
      - Click the Edit action for "SpecTestPerson"
      - Change the name to "SpecTestRenamed" and save
    verify:
      - The edit-person modal is pre-populated with the current details
      - After saving, the list shows "SpecTestRenamed" and no longer shows "SpecTestPerson"
      - A success message is displayed
    cleanup:
      - Delete the person "SpecTestRenamed"

  - name: people_can_delete_person
    goal: The user can delete a person after confirming
    priority: high
    steps:
      - Create a person named "SpecTestPerson" if needed
      - Click the Delete action for "SpecTestPerson"
      - Confirm the deletion in the confirmation dialog
    verify:
      - A confirmation dialog is shown before deleting
      - After confirming, "SpecTestPerson" is removed from the people list
      - A success message is displayed
      - Any faces previously assigned to the person return to the unassigned pool

  - name: people_can_view_and_remove_faces
    goal: The user can open a person's faces and unassign a face
    priority: medium
    steps:
      - Navigate to the people page
      - Open the Faces view for a person that has assigned faces
      - Select one face and remove it from the person
    verify:
      - The per-person faces view shows the person's assigned face thumbnails
      - After removing, the face count for that person decreases
      - A success message is displayed
      - The removed face becomes available again on the face assignment page
  # ---------------------------------------------------------------------------
  # Responsive coverage (P3 — people). The shared shell contract itself is verified
  # in specs/photo_gallery.yaml; what follows is this family's own narrow-screen
  # behaviour. Shared helpers: generated_tests/_support/responsive.ts.
  # ---------------------------------------------------------------------------
  - name: people_list_renders_without_horizontal_overflow_at_every_contract_width
    goal: The people list is contained by the viewport rather than by its six columns
    priority: high
    steps:
      - Load /people at 320, 390, 768, 1024 and 1440 px, then at 844x390
    verify:
      - No element extends past the document width at any of those widths

  - name: people_rows_become_labeled_cards_on_narrow_screens
    goal: The six-column people table stays readable without a horizontal scroll
    priority: high
    steps:
      - Load the people list at 390x844
    verify:
      - Each cell carries its column name as a data-label so the card reads as a labelled record
      - The label is actually rendered by the card's ::before, not merely present in the markup
      - No data is hidden merely to make the row fit — all six cells still render
      - Any remaining tabular surface scrolls inside its own container, never the page

  - name: a_long_unbroken_person_name_does_not_widen_the_people_pages
    goal: A person's name is user data and must never set the page's minimum width
    priority: high
    steps:
      - Create a person whose name is one unbroken run of ~90 characters
      - Load the people list at 320, 390, 768 and 1440 px
      - Load that person's faces page at 320x568
    verify:
      - The people list does not scroll horizontally at any width
      - The person-faces heading shows the name and wraps it
      - The empty-state sentence that interpolates the name breaks it too — it used to force a 672px page at a 320px viewport

  - name: the_add_person_dialog_fits_a_320px_viewport
    goal: The add/edit dialogs are contained surfaces with a single scroll region
    priority: high
    steps:
      - Load the people list at 320x568 and open the Add Person dialog
    verify:
      - The dialog content fits inside the viewport
      - The dialog body never scrolls sideways
      - The footer actions stay inside the viewport and keep a full-size target

  - name: an_in_progress_add_person_edit_survives_a_resize_through_the_breakpoint
    goal: Resizing must not discard a half-filled dialog
    priority: high
    steps:
      - Open the Add Person dialog at 390x844 and type a name
      - Resize to 1440x900 without reloading
    verify:
      - The dialog is still open
      - The typed name is still there
      - The dialog still fits inside the viewport

  - name: person_faces_route_renders_without_horizontal_overflow_at_every_contract_width
    goal: The per-person face gallery is contained at every supported width
    priority: high
    steps:
      - Open the faces page of a person who has faces at 320, 390, 768, 1024 and 1440 px
    verify:
      - No element extends past the document width at any of those widths

  - name: person_faces_panels_satisfy_the_peer_panel_contract
    goal: Both panels the person-faces page registers obey the shared contract
    priority: high
    steps:
      - Drive the shared panel-contract helper against person-faces-actions and person-faces-filters
    verify:
      - Each panel is closed on first paint and is a peer of Menu
      - Opening Menu closes the panel and vice versa
      - The live panel DOM is restored to the page at desktop width, keeping what it contained

  - name: person_faces_exposes_actions_and_filters_as_peers
    goal: A person's face gallery follows the same two-panel contract as the faces page
    priority: medium
    steps:
      - Open a person's faces page at 390x844
      - Enter a Min Similarity value in the Filters panel, then resize to 1440x900
    verify:
      - Actions and Filters each have their own peer navbar button, Actions first, with Menu last
      - The entered filter value survives the resize
      - The page does not scroll horizontally

  - name: the_person_face_gallery_is_usable_with_a_coarse_pointer
    goal: Selecting faces is the job of this page, so it must work under a thumb
    priority: high
    steps:
      - Open a person's faces page in a coarse-pointer context at 390x844
      - Tap a face card, then tap Clear selection
    verify:
      - Select all and Clear selection are at least 44px tall
      - Tapping a card selects it — the hover lift is not the affordance
      - The page does not scroll horizontally before or after selecting
