feature: locations
description: User can view located photos on a map, filter markers client-side, select photos through clustered markers, and assign or clear location names

tags:
  - smoke
  - core

preconditions:
  - Application is running
  - Database contains sample photos, at least one of which has GPS coordinates
  - The locations page is available at /locations

context:
  - tag: locations-template
    path: templates/locations/list.html
    description: Map page with OpenLayers map, shared filter sidebar, configurable filter modal, and selection side panel
  - tag: locations-routes
    path: routes/locations.py
    description: Routes for locations payload, bulk location-name update, assign-location nearby radius config, and reverse geocoding
  - tag: locations-map-js
    path: static/locations/list.js
    description: Client map wiring for clustering, photo-id based selection, partial cluster rendering, recommendation lookup, and bulk assignment
  - tag: client-filter-js
    path: static/filters/client_filter.js
    description: Client-side implementation of the shared filter sidebar for the locations map
  - tag: filter-sidebar
    path: templates/_sidebar.html
    description: Shared filter form with Apply, Clear, and Configure controls
  - tag: locations-route-tests
    path: tests/yaffo/routes/test_locations.py
    description: Server-side expectations for payload fields, sidebar rendering, nearby radius config, bulk update, and geocode rate limits
  - tag: responsive-nav-js
    path: static/nav.js
    description: Narrow-screen Menu and the peer page-panel contract (moves/restores live panel DOM)
  - tag: responsive-nav-panel-template
    path: templates/components/nav_panel.html
    description: Declares a page panel and its peer navbar button; the registration contract
  - tag: responsive-shell
    path: static/responsive.css
    description: Shared adaptive layout; owns the narrow-screen rules every page inherits

data:
  - Bennett photos have GPS metadata and should appear on the map
  - 2015-10-09_103400_chicago-riverwalk.png and 2015-10-11_085600_family-breakfast.png have distinct but nearby Chicago coordinates
  - 2021-07-10_101800_beach-arrival.png has distant GPS metadata at Siesta Key Beach
  - The home and beach photos are visually distinct locations on the map view
  - Tests resolve fixture images by filename rather than relying on database IDs
  - Located photos may be named or unnamed; unnamed means the location name is null or blank
  - The map payload includes fields used by client-side filters, including path, year, month, device, favorite, media type, people, labels, tags, name, latitude, and longitude

scenarios:
  - name: locations_map_displays_photo_markers
    goal: The map loads and shows visually distinct markers/clusters for photos that have coordinates
    priority: high
    steps:
      - Navigate to the locations page
      - Wait for the map container to be visible
    verify:
      - The map (id "map") is visible and rendered
      - At least one photo marker or cluster is shown on the map
      - The Siesta Key beach photos and the Chicago-area photo groups appear as separate visible map points or clusters
      - Photos from each Bennett event remain close enough to form nearby groups at normal map zoom levels
      - Map tiles load without broken-image errors
      - The map view is initially fitted to the located photos

  - name: locations_selection_panel_shows_photo_details
    goal: Clicking a marker/cluster selects its photos and opens the side panel with preview plus assignment controls
    priority: high
    steps:
      - Navigate to the locations page
      - Click on a photo marker or cluster on the map
    verify:
      - The side panel (id "selection-panel") becomes visible
      - The collapsible "Preview" section (class "preview-section") shows the photo, a photo selector and thumbnails when the cluster holds several photos
      - Clicking a thumbnail (class "preview-thumb") swaps the previewed photo
      - Clicking the "Preview" toggle (class "preview-toggle") collapses and expands the section
      - The assignment controls (id "mass-assign-btn") are available for the clicked cluster
      - The selected photo IDs are tracked in window.PHOTO_ORGANIZER.locations.map.selectedPhotoIds
      - Zooming or panning the map recalculates clusters while preserving the selected photo IDs and updating the panel for the new cluster grouping
      - Shift-clicking another cluster adds it to the selection; shift-clicking a selected cluster removes it
      - Holding Shift and dragging a box adds the enclosed clusters to the current selection
      - Clicking the close button (class "selection-panel-close") or an empty spot on the map clears the selection and hides the panel

  - name: locations_partial_cluster_selection_indicator
    goal: Partially selected clusters are rendered as proportionally filled markers and follow the partial-to-full-to-unselected selection cycle
    priority: high
    steps:
      - Navigate to the locations page with multiple located photos that can cluster together
      - Select only some photos in a cluster, then change zoom so the selected photos are clustered with unselected photos
      - Click the partially selected cluster
      - Click the fully selected cluster again
    verify:
      - The cluster marker shows a partial pie fill based on selected photos divided by total photos in that cluster
      - A cluster with 3 selected photos out of 4 total photos is rendered as approximately 75% filled
      - The cluster summary in the side panel shows the selected count over total count for partial clusters
      - Clicking a partial cluster makes every photo in that cluster selected
      - Clicking the now fully selected cluster clears those photos from the selection

  - name: locations_filter_sidebar_filters_client_side
    goal: Applying filters narrows map markers in the browser without moving the viewport or reloading the page
    priority: medium
    steps:
      - Navigate to the locations page
      - Record the current map center and zoom
      - In the filter sidebar, enable a filter such as "Only show photos without location names" (name "unnamed")
      - Click the "Apply Filters" button
    verify:
      - The browser remains on /locations and the page is not reloaded
      - The map updates to show only markers matching the filter
      - Photos that do not match the filter are removed from the vector source
      - The map center and zoom remain unchanged when the filter is applied
      - Any active map selection is cleared when the visible marker set changes

  - name: locations_clear_filters_client_side
    goal: Clearing filters restores the full marker set without reloading the page or resizing the viewport
    priority: medium
    steps:
      - Navigate to the locations page
      - Apply one or more filters from the shared filter sidebar
      - Record the current map center and zoom
      - Click the sidebar "Clear" control
    verify:
      - Filter controls are reset to their empty or default values
      - The full set of located photos is restored to the map
      - The browser remains on /locations and the page is not reloaded
      - The map center and zoom remain unchanged when filters are cleared

  - name: locations_configure_filter_sidebar
    goal: The user can customize which filter groups appear on the locations page independently from other pages
    priority: low
    steps:
      - Navigate to the locations page
      - Open the filter configuration modal from the sidebar
      - Hide a filter group and save
      - Reload the locations page
    verify:
      - The hidden filter group no longer appears in the locations sidebar
      - The filter configuration is saved with data-page "locations"
      - Other default filter groups remain available

  - name: locations_select_clusters_and_assign_name
    goal: The user can select photos through one or more clusters and assign a location name to all selected photos
    priority: high
    steps:
      - Navigate to the locations page
      - Hold Shift and drag a box to select one or more clusters
      - In the selection panel enter a location name such as "Test Beach"
      - Save/apply the assigned name
    verify:
      - The selection panel (id "selection-panel") shows the count of selected photos
      - After saving, a success message is displayed
      - The selected photos now carry the location name "Test Beach"
      - The map feature payload is updated in place so active client-side location filters see the new name
      - The selection is cleared and the panel closes after a successful assignment
    cleanup:
      - Clear the location name "Test Beach" from the affected photos

  - name: locations_clear_location_names
    goal: The user can select photos through clusters and remove location names from all selected photos
    priority: medium
    steps:
      - Navigate to the locations page
      - Hold Shift and drag a box to select one or more clusters
      - Click the "Clear location names" button in the selection panel
    verify:
      - A success message reports the names were cleared
      - The selected photos no longer carry a location name
      - The "only unnamed" filter includes the affected photos again
      - The clear request sends the explicit clear flag so a blank custom name cannot accidentally clear names
      - The selection is cleared and the panel closes after a successful clear

  - name: locations_recommends_existing_nearby_name
    goal: The app recommends an existing nearby location name before calling reverse geocoding
    priority: medium
    steps:
      - Navigate to the locations page with the assign-location nearby radius configured
      - Select photos whose medoid is near other photos that all share one non-empty location name
    verify:
      - The side panel shows one recommended quick-assign button
      - The recommended name matches the unique nearby existing location name
      - The recommendation considers all photos within the configured nearby radius of the medoid photo, not only selected photos
      - No reverse-geocode request is sent when there is exactly one nearby existing location name
      - Selecting the Chicago Grant Park photo when only a White House photo has the name "The White House" uses the reverse-geocode suggestion instead of recommending "The White House"


  - name: locations_reverse_geocode_suggests_name
    goal: The app falls back to reverse geocoding when no unique nearby existing location name can be used
    priority: medium
    steps:
      - Navigate to the locations page
      - Select one or more photos that have coordinates but no unique nearby existing location name
    verify:
      - A suggested location name is offered as a recommended quick-assign action
      - The reverse-geocode request uses the medoid photo coordinates from the selected photos
      - Re-rendering the panel for the same medoid reuses the in-flight or cached reverse-geocode result instead of sending duplicate requests
      - If the selection changes before the lookup returns, the stale result is not rendered into the panel

  - name: locations_reverse_geocode_rate_limit_fallback
    goal: The page handles reverse-geocode rate limiting without duplicating recommended buttons
    priority: medium
    steps:
      - Navigate to the locations page
      - Mock or cause the reverse-geocode endpoint to return HTTP 429
      - Select a cluster that would otherwise need reverse geocoding
      - Trigger map movement or panel re-rendering
    verify:
      - No recommended location button is rendered for the rate-limited lookup
      - The panel remains usable for quick-assign existing names, custom assignment, clear selection, and clear names
      - Additional panel renders do not issue more reverse-geocode requests after the rate limit is detected
      - Multiple recommended buttons are not rendered for the same selection
  # ---------------------------------------------------------------------------
  # Responsive coverage (P4 — locations). The shared shell contract itself is verified
  # in specs/photo_gallery.yaml; what follows is this family's own narrow-screen
  # behaviour. Shared helpers: generated_tests/_support/responsive.ts.
  # ---------------------------------------------------------------------------
  - name: locations_route_fits_every_contract_viewport
    goal: The map page survives every viewport class in the support contract
    priority: high
    steps:
      - Load the locations page at 320x568, 390x844, 844x390, 768x1024, 1024x768 and 1440x900
    verify:
      - There is no page-level horizontal overflow at any of those viewports
      - The map is told its container's size at each of them
      - The map keeps a usable height rather than collapsing to a strip on a short landscape phone
  - name: locations_filter_panel_uses_a_peer_navbar_panel
    goal: The map's filter sidebar follows the shared panel contract
    priority: high
    steps:
      - Load the locations page at 390x844
      - Open Filters, enter a value, press Escape, reopen, then resize to 1440x900
    verify:
      - Filters is a peer of Menu with a server-rendered applied-filter count badge, hidden when nothing is applied, and the panel is closed on first paint
      - Escape closes it
      - Reopening shows the same live DOM, so the ticked checkbox is still ticked
      - The entered value survives the resize back to desktop
  - name: locations_narrow_filters_apply_and_clear_without_leaving_the_map
    goal: Applying and clearing filters from inside the navbar panel filters the markers in place instead of navigating
    priority: high
    steps:
      - Load the locations page at 390x844 with one named photo
      - Open the Filters panel, tick "only unnamed" and press Apply Filters
      - Reopen the panel and press Clear Filters
    verify:
      - The browser stays on /locations and the document is never reloaded
      - The visible marker set narrows to the unnamed photos and is restored by Clear
      - The map centre and zoom are unchanged by either control
      - Nothing about the open panel widens the page
  - name: locations_selection_details_open_in_a_centered_modal
    goal: On a narrow screen the selected-cluster assignment details open in a centered modal over a full-width map, and go back to being the map's side column on desktop
    priority: high
    steps:
      - Load the locations page at 390x844 and select a cluster
      - Resize to 1440x900 without reloading
    verify:
      - The selection panel is centered inside the viewport with edge gutters, a backdrop and dialog semantics
      - The panel fits inside the viewport and does not widen the page
      - The map still spans the whole layout row underneath it, so it remains the primary surface
      - On desktop the same panel is positioned in the normal flow to the right of the map
      - The selection is unchanged by the resize and no reload was required
  - name: locations_selection_modal_contains_its_own_overflow
    goal: The assignment modal scrolls its own content instead of the document
    priority: medium
    steps:
      - Load the locations page at 320x568
      - Shift-drag to select every cluster so the panel content outgrows the modal
      - Scroll the panel body to its end
    verify:
      - The panel body is the scroll region and its content is taller than the modal
      - Its overscroll is contained, so reaching the end does not chain to the page
      - Scrolling the panel does not move the document
      - The modal fits the viewport and the page does not overflow horizontally
  - name: locations_map_follows_narrow_container_resizes
    goal: OpenLayers is told its new size after every layout change
    priority: high
    steps:
      - Load the locations page at 768x1024
      - Resize to 390x844 without reloading
      - Select a cluster and open the selection panel
      - Rotate to 844x390 with the panel open, then close the panel
    verify:
      - The map reports a non-zero size at the first viewport
      - After the resize the map's own size matches its container's client width
      - The map's size still matches its container after the panel opens, after the rotation and after the panel closes
      - The selection panel becomes active, is visible, and does not widen the page
      - No reload was required at any point
  - name: locations_map_state_survives_a_resize_through_the_breakpoint
    goal: Crossing the breakpoint never silently resets the user's view of the map
    priority: high
    steps:
      - Load the locations page at 1440x900 and record the map centre and zoom
      - Resize to 390x844, then to 844x390, then back to 1440x900, waiting for the map to pick up its new size each time
    verify:
      - The map centre is unchanged
      - The zoom level is unchanged
      - No reload was required
  - name: locations_unsaved_assignment_survives_a_resize_through_the_breakpoint
    goal: A location name typed but not yet assigned is not thrown away by a panel re-render or a resize through the breakpoint
    priority: high
    steps:
      - Load the locations page at 1440x900, select a cluster and type a custom location name without assigning it
      - Resize to 390x844, re-render the selection panel, then resize back to 1440x900
      - Clear the selection and select the cluster again
    verify:
      - The typed name is still in the custom-location input after the resize
      - The selection, the map centre and the zoom are unchanged
      - A panel re-render does not clear the typed name
      - No reload was required
      - Clearing the selection is an explicit discard, so the draft name is gone when the cluster is selected again
  - name: locations_long_location_names_do_not_widen_the_narrow_page
    goal: A very long location name is absorbed by the modal instead of pushing the page sideways
    priority: medium
    steps:
      - Assign a long unbreakable location name to every located photo
      - Load the locations page at 320x568 and select every cluster
    verify:
      - The quick-assign chip for the long name is visible and no wider than the viewport
      - The cluster summary and the modal stay inside the viewport
      - There is no page-level horizontal overflow
  - name: locations_touch_reaches_every_hover_only_affordance
    goal: Everything the page only said through :hover or a native title tooltip is reachable with a coarse pointer
    priority: high
    steps:
      - Open the locations page in a touch context at 390x844 with a long location name assigned
      - Select a multi-photo cluster and tap a thumbnail, the Preview toggle, and the panel close control
    verify:
      - The quick-assign chip renders the whole location name instead of ellipsising it behind a title tooltip
      - A thumbnail is at least a 44 px target and tapping it puts the photo's name on screen, which is the title tooltip's information
      - Tapping the Preview toggle collapses the section
      - The panel close control is at least a 44 px target and tapping it dismisses the modal
