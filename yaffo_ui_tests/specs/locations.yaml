feature: locations
description: User can view photos on a map by location, filter for unnamed places, and assign location names to clusters of photos

tags:
  - smoke
  - core

preconditions:
  - Application is running
  - Database contains sample photos, at least one of which has GPS coordinates

context:
  - tag: locations-template
    path: templates/locations/list.html
    description: Map page with OpenLayers map, cluster selection panel, and unnamed filter
  - tag: locations-routes
    path: routes/locations.py
    description: Routes for the locations list, bulk location-name update, and reverse geocoding
  - tag: locations-map-js
    path: static/locations/list.js
    description: Client map wiring — cluster selection, popup, and bulk assignment

data:
  - Photo "DSCN0010.jpg" (id 14) has latitude/longitude and should appear on the map
  - Most Obama sample photos have no GPS coordinates

scenarios:
  - name: locations_map_displays_photo_markers
    goal: The map loads and shows markers/clusters for photos that have coordinates
    priority: high
    steps:
      - Navigate to the locations page
      - Wait for the map container to be visible
    verify:
      - The map (id "map") is visible and rendered
      - At least one photo marker or cluster is shown on the map
      - Map tiles load without broken-image errors

  - name: locations_popup_shows_photo_details
    goal: Clicking a marker/cluster selects it and the side panel offers preview plus assignment
    priority: high
    steps:
      - Navigate to the locations page
      - Click on a photo marker or cluster on the map
    verify:
      - The side panel (id "selection-panel") becomes visible
      - The collapsible "Preview" section (class "preview-section") shows the photo, a photo selector and thumbnails when the cluster holds several photos
      - Clicking a thumbnail (class "preview-thumb") swaps the previewed photo
      - Clicking the "Preview" toggle (class "preview-toggle") collapses and expands the section
      - The assignment controls (id "mass-assign-btn") are available for the clicked cluster
      - Clicking an empty spot on the map clears the selection and hides the panel

  - name: locations_filter_unnamed_photos
    goal: The "only unnamed" filter narrows the map to photos without a location name
    priority: medium
    steps:
      - Navigate to the locations page
      - In the filter sidebar's Locations group, enable the "Only show photos without location names" checkbox (name "unnamed")
      - Click the "Apply Filters" button
    verify:
      - The map updates to show only photos that have no assigned location name
      - Photos that already have a location name are removed from the map
      - Unchecking the checkbox and applying again restores the full set of located photos

  - name: locations_select_clusters_and_assign_name
    goal: The user can select one or more clusters and assign a location name to all their photos
    priority: high
    steps:
      - Navigate to the locations page
      - Hold Shift and drag a box to select one or more clusters
      - In the selection panel enter a location name such as "Test Beach"
      - Save/apply the assigned name
    verify:
      - The selection panel (id "selection-panel") shows the count of selected photos
      - After saving, a success message is displayed
      - The selected photos now carry the location name "Test Beach"
    cleanup:
      - Clear the location name "Test Beach" from the affected photos

  - name: locations_clear_location_names
    goal: The user can select clusters and remove the location names from all their photos
    priority: medium
    steps:
      - Navigate to the locations page
      - Hold Shift and drag a box to select one or more clusters
      - Click the "Clear location names" button in the selection panel
    verify:
      - A success message reports the names were cleared
      - The selected photos no longer carry a location name
      - The "only unnamed" filter includes the affected photos again

  - name: locations_reverse_geocode_suggests_name
    goal: The app can suggest a place name from coordinates via reverse geocoding
    priority: medium
    steps:
      - Navigate to the locations page
      - Select a cluster of photos that has coordinates
      - Trigger the reverse-geocode / suggest-name action in the selection panel
    verify:
      - A suggested location name is offered as a recommended quick-assign action
      - The suggestion reflects the coordinates of the selected photos
