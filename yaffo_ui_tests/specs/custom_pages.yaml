feature: custom_pages
description: User can create custom dashboard pages, add and arrange widgets, generate widgets with the AI assistant, present the page, and delete it

tags:
  - core

preconditions:
  - Application is running

context:
  - tag: pages
    attribute: yaffo-pages
    description: Python routes tagged for the custom pages / AI page builder feature
  - tag: pages-design-template
    path: templates/pages/design.html
    description: Design view — editable gridstack, page metadata form, and AI assistant chat
  - tag: pages-presentation-template
    path: templates/pages/presentation.html
    description: Read-only presentation view of a published page
  - tag: pages-grid-js
    path: static/pages/grid.js
    description: Client grid wiring — widget lifecycle, generation polling, save/publish
  - tag: pages-routes
    path: routes/pages.py
    description: Routes for page CRUD, widget preview, version status/publish/cancel, and chat
  - tag: responsive-nav-js
    path: static/nav.js
    description: Narrow-screen Menu and the peer page-panel contract (moves/restores live panel DOM)
  - tag: responsive-nav-panel-template
    path: templates/components/nav_panel.html
    description: Declares a page panel and its peer navbar button; the registration contract
  - tag: responsive-shell
    path: static/responsive.css
    description: Shared adaptive layout; owns the narrow-screen rules every page inherits

data:
  - A page edits exactly one version — the working draft if one exists, else the published version
  - A generation forks a working draft; Save publishes a READY draft, Cancel discards it
  - Sandbox Environment does not have API Keys setup so use client side interception to simulate agent interactions

scenarios:
  - name: pages_create_new_page
    goal: The user can create a new custom page
    priority: high
    steps:
      - Create a new custom page (from the pages navigation / create action)
      - Open the new page's design view
    verify:
      - A new page is created and opens in the design view
      - The page starts with a default/"Untitled Page" title and no widgets
    cleanup:
      - Delete the created page

  - name: pages_edit_metadata_and_save
    goal: The user can edit the page title, subtitle, tab order, and show-title, then save
    priority: high
    steps:
      - Create a page and open its design view
      - Set the Title to "SpecTestPage" and a Subtitle
      # Tab order is a POSITION among the nav pages; the server repositions and
      # clamps out-of-range values, so tests must use a valid position.
      - Set a Tab order value and toggle "Display title?"
      - Click the "Save" button
    verify:
      - The Title (id "page-title"), Subtitle, Tab order, and Display-title controls are editable
      - After saving, the page reflects the new title and metadata
      - Navigating back to the page shows the saved values
    cleanup:
      - Delete the page "SpecTestPage"

  - name: pages_design_add_widget_manually
    goal: The user can add a blank widget to the grid and rename it
    priority: high
    steps:
      - Create a page and open its design view
      - Click the "Add widget" button (id "add-widget-button")
      - Rename the new widget via the widget title pencil
      - Click Save
    verify:
      - A new widget shell is added to the grid
      - The widget title can be edited inline and persists after save
    cleanup:
      - Delete the page

  - name: pages_generate_widgets_via_ai_chat
    goal: The AI assistant can generate widgets from a natural-language request
    priority: high
    steps:
      - Create a page and open its design view
      - In the assistant conversation, describe what you want (e.g. "show a count of my photos")
      - Send the message and wait for the generation to finish
    verify:
      - The grid locks and a status bar ticks while generating
      - The conversation feed shows the user and assistant messages
      - When the draft is READY, the generated widget(s) render on the grid
      # Cancel is only enabled while a run is IN_PROGRESS (or FAILED); on a READY
      # draft it is disabled — discarding means cancelling during the run.
      - Save publishes the READY draft
    cleanup:
      - Delete the page

  - name: pages_presentation_view_renders_widgets
    goal: The published page renders its widgets read-only in the presentation view
    priority: medium
    steps:
      - Open the seeded "Florida Trip" page in its presentation (non-design) view
    verify:
      - It is the only seeded custom page
      - A full-width Hero banner widget appears above a full-width Photo gallery widget
      - The hero and all 13 Florida-trip gallery photos render in their iframes
      - The design view shows a realistic two-round conversation refining the page
      - Widgets render without edit controls
      - The grid is static (widgets cannot be dragged or resized)

  - name: pages_delete_page
    goal: The user can delete a custom page after confirming
    priority: high
    steps:
      - Create a page named "SpecTestPage" and open its design view
      - Click the "Delete Page" button (id "delete-page-button")
      - Confirm the deletion
    verify:
      - A confirmation dialog is shown before deleting
      - After confirming, the page is removed and no longer appears in navigation
  # ---------------------------------------------------------------------------
  # Responsive coverage (P8 — custom pages). The shared shell contract itself is verified
  # in specs/photo_gallery.yaml; what follows is this family's own narrow-screen
  # behaviour. Shared helpers: generated_tests/_support/responsive.ts.
  # ---------------------------------------------------------------------------
  - name: custom_page_routes_fit_every_contract_width
    goal: The design and presentation views contain themselves at every supported width
    priority: high
    steps:
      - Open a page's design view and its presentation view at 320, 390, 768, 1024 and 1440 px
    verify:
      - Neither view scrolls the page horizontally at any of those widths
      - Custom pages register no page panel of their own, so Menu is the only narrow
        navbar toggle — the Pages bar is the shared shell's, verified on Home
  - name: custom_page_canvas_column_bands_follow_the_canvas_not_the_window
    goal: The grid picks its column count from the width of the canvas element
    priority: high
    steps:
      - Open a page's design view at 1440x900, then at 1280x900, 768x1024 and 390x844
      - Open the same page's presentation view at 1280x900, 768x1024 and 390x844
    verify:
      - A canvas of 900 px or more runs the authored 12 columns
      - At 1280 px the editor panel still sits beside the grid, so the design canvas
        is in the 6-column band while the presentation view — same window, no editor
        panel — is still on 12; a viewport media query could not tell them apart
      - At 768 px both views share one full-width canvas and both run 6 columns
      - A canvas under 600 px runs a single column, is marked is-single-column, and
        every widget spans that column
  - name: custom_page_intermediate_band_widgets_get_a_real_width
    goal: Widgets in the six-column band are laid out rather than collapsed
    priority: high
    steps:
      - Open a published page at 768x1024, where the canvas is in the 6-column band
    verify:
      - Each authored half-width widget measures half the canvas, not zero
      - The page does not scroll horizontally
      # Regression: the vendored gridstack.min.css only carries the width/offset
      # rules for .gs-12 and .gs-1 — upstream's gridstack-extra.css (2–11) is not
      # vendored — so every .gs-6 item collapsed to 0 px while its header buttons
      # still painted over the canvas. pages/detail.css now supplies those rules.
  - name: custom_page_narrow_widgets_keep_a_readable_minimum_height
    goal: A short wide widget gets vertical room once it is squeezed into one column
    priority: high
    steps:
      - Seed a page with a two-row, full-width widget
      - Open its presentation view at 390x844
    verify:
      - The widget is at least the one-column floor of three rows tall
      - Its card does not scroll horizontally, and its frame is not a nested scroll region
      - The same widget is back to its authored two rows at 1440x900
  - name: custom_page_widgets_move_and_resize_without_dragging
    goal: Every drag gesture on the canvas has an explicit control equivalent
    priority: high
    steps:
      - Open a custom page's design view at 390x844 with a coarse pointer
      - Use a widget's taller control, then its shorter control, then its move-down control
    verify:
      - The direct controls are visible and at least 44x44 px in this mode
      - Taller increases the widget height by one row and shorter restores it
      - Shrinking closes the row it frees rather than leaving a hole in the stack
      - Move-down changes the widget order, even straight after a resize
      - The canvas never scrolls the page horizontally
      # Regression: the canvas floats, so a shrink left the freed row behind as a
      # gap. GridStack's swap() refuses to reorder two items that are neither the
      # same size nor touching, so after any resize Move down silently did
      # nothing. One column is now compacted after a resize, and a refused swap
      # exchanges the two positions directly instead of giving up.
  - name: custom_page_touch_drag_on_a_widget_scrolls_the_page
    goal: Design-mode drag gestures are off on touch, so a swipe scrolls the page
    priority: high
    steps:
      - Open a design view at 390x844 in a touch context
      - Drag upward with a real emulated touch stream, starting on a widget header
    verify:
      - The document scrolled
      - The widget did not move — GridStack's move/resize handlers are disabled in
        this mode, so the gesture never competes with the scroll
  - name: custom_page_mouse_can_reach_the_direct_controls
    goal: The move/resize controls are reachable with a mouse, not only by focus
    priority: medium
    steps:
      - Open a design view at 1440x900
      - Hover a widget card
    verify:
      - The controls are hidden until the card is hovered or focused
      - Hovering reveals them and they accept a click
      # Regression: the shared layer reveals them on :focus-within only, which a
      # mouse never produces on its own, so on desktop they were unreachable.
  - name: custom_page_save_from_a_narrow_canvas_keeps_the_desktop_layout
    goal: Saving while the canvas is reflowed publishes the authored layout
    priority: high
    steps:
      - Seed a page with two widgets side by side in the 12-column layout
      - Open its design view at 390x844, where the grid is a single column
      - Click Save
      - Reopen the design view at 1440x900
    verify:
      - The widgets are still side by side with their authored widths and heights
      # Regression: the grid's live nodes ARE the one-column layout, so saving
      # straight off the grid from a phone flattened every widget to one column
      # and persisted the heights the reflow had inflated.
  - name: custom_page_layout_survives_a_resize_through_the_breakpoint
    goal: Reflowing to one column and back restores the authored layout and unsaved edits
    priority: high
    steps:
      - Open a design view at 1440x900 and start renaming a widget without saving
      - Resize to 390x844 and back to 1440x900
    verify:
      - The widgets return to their authored columns, rows and heights
      - The in-progress title edit is still there — no reload happened
  - name: custom_page_presentation_reflows_in_source_order
    goal: A published page stacks its widgets in reading order on a narrow canvas
    priority: high
    steps:
      - Open a published page's presentation view at 390x844
    verify:
      - The widgets' visual top-to-bottom order matches their DOM order, which the
        server renders in (grid_y, grid_x) reading order
      - Every widget spans the full single column
  - name: custom_page_widgets_receive_their_real_container_size
    goal: Widget iframes are sized to the space they actually occupy
    priority: medium
    steps:
      - Open a custom page in presentation mode at 390x844 and at 1440x900
    verify:
      - Each widget iframe's measured box matches its container at both sizes
      - The widget document's own viewport (its innerWidth) is that same width, so
        media queries written inside the widget measure its real box
  - name: custom_page_long_widget_titles_do_not_widen_the_canvas
    goal: An unbreakable widget title cannot push the page sideways
    priority: medium
    steps:
      - Seed a widget whose title is one long unbroken word
      - Open the design view at 320x568
    verify:
      - The page does not scroll horizontally
      - The title is truncated inside its header rather than widening the card
