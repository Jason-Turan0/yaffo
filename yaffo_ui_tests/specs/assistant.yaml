feature: assistant
description: Ask Yaffo, the in-app assistant — the empty-conversation notice, the diagnostics settings, and opening it from a failed job with that job attached

tags:
  - core

preconditions:
  - Application is running
  - An API key is configured under Settings → AI Generation, so the Ask Yaffo button shows
  - Scenarios that send a message need a stubbed model endpoint; the ones here stop before a model is called

context:
  - tag: assistant-panel-template
    path: templates/assistant/_panel.html
    description: The panel — conversation switcher, empty-conversation notice, chat dialog, and context chip
  - tag: assistant-js
    path: static/assistant/assistant.js
    description: Panel wiring — transcript rendering (expandable activity lines), the notice in the empty state, attached context, "Help me with this"
  - tag: assistant-routes
    path: routes/assistant.py
    description: Conversation, message and settings routes
  - tag: assistant-settings-template
    path: templates/settings/_assistant.html
    description: Settings → Assistant — the on/off switch, diagnostics switches, the changes it can propose (per-action switches and the confirm-count threshold), delete all
  - tag: assistant-plan-card-js
    path: static/assistant/plan_card.js
    description: Change-plan cards — steps worded from server facts, Approve / Decline, count confirmation, the outcome and Undo
  - tag: assistant-plans
    path: site_agents/assistant/plans.py
    description: Recording, approving (replay of the frozen calls), declining, expiring and undoing change plans
  - tag: job-card-template
    path: templates/fragments/job_status_fragment.html
    description: A job card; a failed job shows "Help me with this" when the assistant is ready

data:
  - All four troubleshooting checks (Logs, Library contents, Media folders, Background jobs) are on by default
  - Low- and medium-risk changes are on by default; the three file changes (rename, move, move to trash) are off
  - The confirm-count threshold is 500

scenarios:
  - name: assistant_notice_in_empty_conversation
    goal: An empty conversation says which model answers and whether it checks this computer, with a way to change that
    priority: high
    steps:
      - Click the Ask Yaffo button
      - Click New
      - Click "Change in Settings" in the notice
    verify:
      - The notice names the provider and model and says what it reads on this computer is sent with the question
      - The message box is usable straight away; nothing has to be accepted first
      - The link opens the settings page at the Assistant section

  - name: assistant_diagnostics_switches
    goal: The user can choose what the assistant may look at
    priority: medium
    steps:
      - Navigate to the settings page
      - In the Assistant section, untick every diagnostics switch
      - Reload the page and open the panel on a new conversation
    verify:
      - Each switch saves with a success message
      - The notice says it answers from the documentation only and nothing from this computer is sent
    cleanup:
      - Tick every diagnostics switch again

  - name: assistant_help_with_failed_job
    goal: From a failed job, the user opens the assistant with the job attached
    priority: medium
    steps:
      - Make a job fail (for example, index a media folder whose drive is not mounted)
      - Navigate to Utilities → Index Photos
      - Click "Help me with this" on the failed job card
    verify:
      - The panel opens on a new conversation
      - A chip in the composer names the job, and the message box holds a suggested question
      - Clicking the chip's × removes it

  - name: assistant_opens_from_the_narrow_menu
    goal: On a narrow screen, Ask Yaffo opens from the Menu and the Menu gets out of the way
    priority: medium
    steps:
      - Set the viewport to 390x844
      - Open the navbar Menu
      - Click "Ask Yaffo"
      - Close the assistant panel
    verify:
      - There is no floating Ask Yaffo button in the lower-right corner
      - After clicking "Ask Yaffo", the Menu is closed and the assistant panel is fully visible
      - After closing the panel, focus is on the Menu button

  - name: assistant_change_switches
    goal: The user chooses which library changes the assistant may propose
    priority: medium
    steps:
      - Navigate to the settings page
      - In the Assistant section, find "Changes it can propose"
      - Untick "Add tags" and tick "Move photos to the system trash"
      - Set the confirm-count threshold to 25
      - Reload the page
    verify:
      - The file changes (rename, move, move to trash) start unticked and every other change starts ticked
      - Each switch and the threshold save with a success message
      - After the reload, "Add tags" is unticked, "Move photos to the system trash" is ticked, and the threshold reads 25
    cleanup:
      - Tick "Add tags", untick "Move photos to the system trash", and set the threshold back to 500

  - name: assistant_plan_approve_and_undo
    goal: A change the assistant proposes waits for Approve, runs exactly as shown, and can be undone
    priority: high
    preconditions:
      - A stubbed model endpoint that answers "Tag photos from 2019" with a run_script call tagging the 2019 photos "Trip", then a short reply
    steps:
      - Open Ask Yaffo on a new conversation and send "Tag photos from 2019"
      - Wait for the reply to finish
      - Expand the activity line and click "Show script"
      - Click Approve on the proposed-change card
      - Click Undo on the card, then confirm
    verify:
      - Before approving, the card names the tag and the number of photos, says it can be undone, and no photo has the tag
      - Approve and Decline are disabled while the reply is still being written
      - After Approve, the card says it's done and every 2019 photo has the tag "Trip" (check a photo's details page)
      - After Undo, the card says it was undone and the tag is gone again; photos that had the tag before keep it
      - The Approve click goes through the real button; the spec never calls the approve endpoint directly

  - name: assistant_plan_decline
    goal: Declining a proposed change leaves the library as it was
    priority: medium
    preconditions:
      - The same stubbed model endpoint as assistant_plan_approve_and_undo
    steps:
      - Send "Tag photos from 2019" on a new conversation and wait for the reply
      - Click Decline on the proposed-change card
    verify:
      - The card says it was declined and nothing was changed, with no buttons left
      - No photo has the tag "Trip"
