feature: index_photos
description: User can scan the media directories for photos, view database vs filesystem statistics, and sync the database to import new photos and clear orphaned entries

tags:
  - core

preconditions:
  - Application is running
  - At least one media directory is configured

context:
  - tag: index-photos-template
    path: templates/utilities/index_photos.html
    description: Index Photos page — live stats and the Library status cards (one per problem, each with its fix)
  - tag: index-photos-routes
    path: routes/utilities/index_photos.py
    description: Routes for the streaming filesystem scan and the database sync
  - tag: index-photos-js
    path: static/utilities/index_photos.js
    description: Client wiring — NDJSON scan streaming, the status cards, and their fixes
  - tag: issue-card-component
    path: templates/components/issue_card.html
    description: One Library status card — title with count, what it means, its fix button, files under Show files
  - tag: responsive-nav-js
    path: static/nav.js
    description: Narrow-screen Menu and the peer page-panel contract (moves/restores live panel DOM)
  - tag: responsive-nav-panel-template
    path: templates/components/nav_panel.html
    description: Declares a page panel and its peer navbar button; the registration contract
  - tag: responsive-shell
    path: static/responsive.css
    description: Shared adaptive layout; owns the narrow-screen rules every page inherits

data:
  - The scan streams progress records then a final summary of counts and unindexed/orphaned lists
  - Each problem is a card with its own fix — "Index them" imports the unindexed photos, "Remove them" removes orphaned database rows, "Regenerate thumbnails", "Retry all" for files that couldn't be indexed
  - '"Everything is in sync" shows only when no card applies and no warning (empty media folder, unavailable thumbnail folder) is shown'
  - The summary also counts face crops and video posters the index points at whose files are gone from the thumbnail folder (null when that folder can't be checked)
  - Regenerate thumbnails writes those files again at their recorded paths in one background job; faces keep their people and ignored status

scenarios:
  - name: index_photos_scan_shows_stats
    goal: The page scans the filesystem and fills in the indexing statistics
    priority: high
    steps:
      - Navigate to the Index Photos utility page
      - Wait for the scan to stream and complete
    verify:
      # Per-tick live updates aren't observable on a small library (the stream
      # finishes in one beat); the populated end state is the asserted contract.
      - After the scan, Total on Filesystem, Imported, Indexed, Not Indexed, Orphaned, and Missing Thumbnails counts are populated
      - Each problem found shows its Library status card with a count in the title; its files are listed under "Show files"
      - With no problems, only "Everything is in sync" shows in Library status

  - name: index_photos_fix_unindexed_and_orphaned
    goal: Each card's fix handles only its own problem
    priority: high
    steps:
      - Navigate to the Index Photos utility page and let the scan complete
      - If photos aren't indexed, click "Index them" on that card and wait for the job
      - If entries have no file, click "Remove them" on that card and wait for the job
    verify:
      - A card and its button are visible only when the scan found that problem
      - '"Index them" leaves the orphaned count unchanged; "Remove them" leaves the not-indexed count unchanged'
      - Each fix shows a success message
      - Re-scanning shows the fixed card gone and its count at zero

  - name: index_photos_regenerate_missing_thumbnails
    goal: A face crop whose file was deleted is counted and written again without losing its person
    priority: high
    steps:
      - "Setup: pick a face assigned to a person and delete its crop file from the sandbox thumbnail folder"
      - Navigate to the Index Photos utility page and let the scan complete
      - Click the "Regenerate thumbnails" button
      - Wait for the Regenerate thumbnails job to finish, then reload the page
    verify:
      - Before regenerating, Missing Thumbnails shows at least 1 and the missing-thumbnails section with its button is visible
      - Clicking the button asks for no confirmation and shows a success message
      - The run appears in the run history as "Regenerate thumbnails"
      - After the job, Missing Thumbnails shows 0 and the section is hidden
      - The face's crop file exists again and the face is still assigned to the same person

  # NOT EXERCISED: reaching this state means removing the seeded library
  # directory; if the hourly file_sync automation ticks in that window it deletes
  # every media row as "unconfigured", destroying the shared sandbox.
  - name: index_photos_no_media_dirs_prompts_settings
    goal: With no media directories configured the page prompts the user to add one
    priority: medium
    steps:
      - Ensure no media directories are configured
      - Navigate to the Index Photos utility page
    verify:
      - A "No Media Directories Configured" message is shown
      - A "Go to Settings" link/button is offered
      - The scan does not run and the stats stay empty
  # ---------------------------------------------------------------------------
  # Responsive coverage (P5 — utilities). The shared shell contract itself is verified
  # in specs/photo_gallery.yaml; what follows is this family's own narrow-screen
  # behaviour. Shared helpers: generated_tests/_support/responsive.ts.
  # ---------------------------------------------------------------------------
  - name: utilities_nav_sections_are_separate_peer_panels
    goal: The two utility navigation sections each get their own peer navbar button
    priority: high
    steps:
      - Load the Index Photos page at 390x844
      - Open the Utilities panel, then the Automations panel
    verify:
      - Utilities and Automations are both peers of Menu and both closed on first paint
      - Opening one closes the other
      - Escape closes the open panel
      - Neither panel scrolls the page horizontally
  - name: index_photos_stats_and_results_fit_a_narrow_viewport
    goal: The live stats grid and scan results stay contained at the minimum width
    priority: high
    steps:
      - Load the Index Photos page at 320x568
      - Run a scan and let the results render
    verify:
      - The page never scrolls horizontally
      - The stats grid reflows instead of overflowing
      - Result lists scroll inside their own container while their actions stay visible

  - name: utilities_touch_dialog_preserves_input_across_resize
    goal: The modal fits phone, tablet, and desktop; input survives resize and Cancel closes it
    priority: high
    steps:
      - Open New automation through the phone navigation and enter a name without saving
    verify:
      - The modal fits phone, tablet, and desktop; input survives resize and Cancel closes it
