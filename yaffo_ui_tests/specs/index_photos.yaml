feature: index_photos
description: User can scan the media directories for photos, view database vs filesystem statistics, and sync the database to import new photos and clear orphaned entries

tags:
  - core

preconditions:
  - Application is running
  - At least one media directory is configured

context:
  - tag: index-photos-template
    path: templates/utilities/index_photos.html
    description: Index Photos page — live stats, scan results, and the Sync Database button
  - tag: index-photos-routes
    path: routes/utilities/index_photos.py
    description: Routes for the streaming filesystem scan and the database sync
  - tag: index-photos-js
    path: static/utilities/index_photos.js
    description: Client wiring — NDJSON scan streaming and sync
  - tag: responsive-nav-js
    path: static/nav.js
    description: Narrow-screen Menu and the peer page-panel contract (moves/restores live panel DOM)
  - tag: responsive-nav-panel-template
    path: templates/components/nav_panel.html
    description: Declares a page panel and its peer navbar button; the registration contract
  - tag: responsive-shell
    path: static/responsive.css
    description: Shared adaptive layout; owns the narrow-screen rules every page inherits

data:
  - The scan streams progress records then a final summary of counts and unindexed/orphaned lists
  - Sync imports the unindexed photos and removes orphaned database rows

scenarios:
  - name: index_photos_scan_shows_stats
    goal: The page scans the filesystem and fills in the indexing statistics
    priority: high
    steps:
      - Navigate to the Index Photos utility page
      - Wait for the scan to stream and complete
    verify:
      # Per-tick live updates aren't observable on a small library (the stream
      # finishes in one beat); the populated end state is the asserted contract.
      - After the scan, Total on Filesystem, Imported, Indexed, Not Indexed, and Orphaned counts are populated
      - When there are unindexed or orphaned photos, their result tables are shown

  - name: index_photos_sync_database
    goal: Syncing imports unindexed photos and removes orphaned entries
    priority: high
    steps:
      - Navigate to the Index Photos utility page and let the scan complete
      - If there is work to do, click the "Sync Database" button
      - Wait for the sync to finish
    verify:
      - The Sync button is visible/enabled only when there is unindexed or orphaned work
      - After syncing, a success message is displayed
      - Re-scanning shows the Not Indexed and Orphaned counts reduced toward zero

  # NOT EXERCISED: reaching this state means removing the seeded library
  # directory; if the hourly file_sync automation ticks in that window it deletes
  # every media row as "unconfigured", destroying the shared sandbox.
  - name: index_photos_no_media_dirs_prompts_settings
    goal: With no media directories configured the page prompts the user to add one
    priority: medium
    steps:
      - Ensure no media directories are configured
      - Navigate to the Index Photos utility page
    verify:
      - A "No Media Directories Configured" message is shown
      - A "Go to Settings" link/button is offered
      - The scan does not run and the stats stay empty
  # ---------------------------------------------------------------------------
  # Responsive coverage (P5 — utilities). The shared shell contract itself is verified
  # in specs/photo_gallery.yaml; what follows is this family's own narrow-screen
  # behaviour. Shared helpers: generated_tests/_support/responsive.ts.
  # ---------------------------------------------------------------------------
  - name: utilities_nav_sections_are_separate_peer_panels
    goal: The two utility navigation sections each get their own peer navbar button
    priority: high
    steps:
      - Load the Index Photos page at 390x844
      - Open the Utilities panel, then the Automations panel
    verify:
      - Utilities and Automations are both peers of Menu and both closed on first paint
      - Opening one closes the other
      - Escape closes the open panel
      - Neither panel scrolls the page horizontally
  - name: index_photos_stats_and_results_fit_a_narrow_viewport
    goal: The live stats grid and scan results stay contained at the minimum width
    priority: high
    steps:
      - Load the Index Photos page at 320x568
      - Run a scan and let the results render
    verify:
      - The page never scrolls horizontally
      - The stats grid reflows instead of overflowing
      - Result lists scroll inside their own container while their actions stay visible
