feature: themes
description: User can browse system and custom themes, generate a new theme with the AI assistant, rename, publish or discard drafts, set a default, and delete custom themes

tags:
  - core

preconditions:
  - Application is running

context:
  - tag: themes-template
    path: templates/themes_page/index.html
    description: Themes page — system/custom nav, chat assistant, and theme actions
  - tag: themes-routes
    path: routes/themes_page.py
    description: Routes for theme create, rename, default, publish, discard, delete, chat, status, cancel
  - tag: themes-js
    path: static/themes_page/index.js
    description: Client wiring for the theme chat dialog and theme actions
  - tag: responsive-nav-js
    path: static/nav.js
    description: Narrow-screen Menu and the peer page-panel contract (moves/restores live panel DOM)
  - tag: responsive-nav-panel-template
    path: templates/components/nav_panel.html
    description: Declares a page panel and its peer navbar button; the registration contract
  - tag: responsive-shell
    path: static/responsive.css
    description: Shared adaptive layout; owns the narrow-screen rules every page inherits

data:
  - System themes cannot be renamed or deleted; only custom themes can
  - A generation produces a draft that must be published to take effect or discarded to revert
  - Sandbox Environment does not have API Keys setup so use client side interception to simulate agent interactions

scenarios:
  - name: themes_list_shows_system_and_custom
    goal: The themes page lists the built-in system themes and any custom themes
    priority: high
    steps:
      - Navigate to the themes page
    verify:
      - The Themes heading is visible
      - A System themes group is listed
      - A Custom themes group is listed (or "No custom themes yet" when empty)
      - The currently active/default theme is indicated

  - name: themes_create_new_theme
    goal: The user can create a new custom theme and generate its look with the AI assistant
    priority: high
    steps:
      - Navigate to the themes page
      - Click "New theme" and enter the name "SpecTestTheme"
      - Submit the create form
      - In the conversation, describe the desired look (e.g. "a dark forest green theme")
      - Wait for the generation to finish
    verify:
      - The new-theme modal opens with a Name field
      - The theme "SpecTestTheme" appears under Custom themes
      # With the agent simulated client-side the server never stores a draft, so
      # this scenario verifies the running transcript/busy state; the draft
      # preview/publish/discard flow is covered by themes_publish_or_discard_draft
      # via a draft injected into the theme's ApplicationSettings row.
      - The assistant conversation runs (transcript + busy status) and the page reloads on finish
      - No error messages are shown
    cleanup:
      - Delete the theme "SpecTestTheme"

  - name: themes_rename_theme
    goal: The user can rename a custom theme
    priority: medium
    steps:
      - Create a custom theme named "SpecTestTheme" if needed
      - Select it and click Rename
      - Change the name to "SpecTestRenamed" and save
    verify:
      - The rename modal is pre-populated with the current name
      - The theme is now listed as "SpecTestRenamed"
    cleanup:
      - Delete the theme "SpecTestRenamed"

  - name: themes_publish_or_discard_draft
    goal: A generated draft can be published to take effect or discarded to revert
    priority: high
    steps:
      - Create a custom theme "SpecTestTheme" and generate a draft
      - Click "Save draft" / publish to apply the draft
    verify:
      - Publishing applies the draft as the theme's active look
      - Discarding a draft reverts to the previously published version
      - A success message is displayed
    cleanup:
      - Delete the theme "SpecTestTheme"

  - name: themes_set_default_theme
    goal: The user can make a theme the application default
    priority: medium
    steps:
      - Navigate to the themes page
      - Select a theme and click "Make default"
    verify:
      - The chosen theme is marked as the default
      - The default theme is applied across the app on the next page load

  - name: themes_delete_custom_theme
    goal: The user can delete a custom theme after confirming
    priority: high
    steps:
      - Create a custom theme named "SpecTestTheme" if needed
      - Select it and click Delete
      - Confirm the deletion
    verify:
      - A confirmation dialog is shown before deleting
      - After confirming, "SpecTestTheme" is removed from the Custom themes list
      - System themes have no delete action
  # ---------------------------------------------------------------------------
  # Responsive coverage (P7 — themes). The shared shell contract itself is verified
  # in specs/photo_gallery.yaml; what follows is this family's own narrow-screen
  # behaviour. Shared helpers: generated_tests/_support/responsive.ts.
  # ---------------------------------------------------------------------------
  - name: themes_nav_uses_a_peer_navbar_panel
    goal: The theme list collapses into a peer navbar button
    priority: high
    steps:
      - Load a theme page at 390x844
      - Open the Themes panel, then Menu, then Themes again, then press Escape
      - Resize to 1440x900
    verify:
      - Themes is a peer of Menu and closed on first paint
      - Only one of Menu or Themes is open at a time
      - Escape closes the panel
      - At desktop width the sidebar is back in the page
  - name: themes_pages_fit_every_contract_viewport
    goal: Both a system and a custom theme page render without page-level horizontal overflow
    priority: high
    steps:
      - Load the themes index, a system theme page and a custom theme page at 320, 390, 768, 1024 and 1440 CSS pixels
    verify:
      - The document never scrolls horizontally at any of the contract widths
      - The header actions and the conversation card stay inside the content column
  - name: theme_screens_stay_contained_in_every_built_in_theme
    goal: A theme's own decoration never changes the narrow layout's geometry
    priority: high
    steps:
      - At 320x568 and 390x844, load each built-in theme's page (classic, darkroom, memphis, neobrutalist, photos-app, scrapbook)
      # The page renders AS the theme being viewed (routes/themes_page.py sets
      # `theme=selected_slug`), so this really is each skin's own geometry.
    verify:
      - No theme introduces page-level horizontal overflow at either width
      - Each theme's header actions stay inside the viewport
  - name: themes_long_theme_name_truncates_instead_of_spilling_out_of_the_nav
    goal: A long custom theme name cannot overrun the theme list
    priority: high
    steps:
      - Create a custom theme whose name is one long unbreakable word
      - Read the nav entry at 1440x900 and inside the opened Themes panel at 390x844
    verify:
      - The nav link's content is no wider than the link, at both widths
      - The name is ellipsised and the default badge stays on the row
      - The page does not scroll horizontally
      # Regression. The themes nav put the raw label straight into the <a>,
      # skipping the shared `.panel-nav-label` span that albums, utilities and
      # sharing use, so a long unbreakable name rendered past the edge of the
      # 250px column and out of the mobile panel instead of ellipsising.
  - name: themes_draft_actions_are_reachable_on_a_phone
    goal: Save draft and Discard stay usable once the draft panel appears on a narrow screen
    priority: high
    steps:
      - Give a custom theme a ready draft and load it at 320x568, 390x844 and 1440x900
    verify:
      - Both draft actions are inside the viewport at every width
      - At 320 they stack, and on a coarse pointer each is at least 44 CSS pixels tall
      - At 1440 they are still a single row
      - The draft panel does not widen the page
  - name: themes_generation_chat_fits_and_scrolls_inside_itself
    goal: The theme generation conversation owns its own overflow at a narrow width
    priority: high
    steps:
      - Load a custom theme page at 320x568 with a long transcript
      - Measure the transcript, the message box and the send controls
    verify:
      - The transcript scrolls inside itself rather than growing the document
      - The message box and the Send/Cancel controls stay inside the viewport
      - On a coarse pointer the send controls are at least 44 CSS pixels tall
      - The page does not scroll horizontally
  - name: themes_unsent_chat_message_survives_a_resize_through_the_breakpoint
    goal: A described look that has not been sent yet is not lost when the viewport crosses the breakpoint
    priority: high
    steps:
      - Type a description into the conversation at 390x844
      - Resize to 1440x900, 320x568, 844x390 and back to 390x844
    verify:
      - The unsent text is still in the message box after every resize
      - No page-level horizontal overflow appears at any of those sizes
