feature: photo_gallery
description: User can browse photos in the gallery and all images load correctly

tags:
  - smoke
  - core

preconditions:
  - Application is running
  - Database contains sample photos and browser-playable (h264) sample videos

context:
  - tag: gallery-template
    path: templates/index.html
    description: Main gallery template with photo grid and selectors
  - tag: gallery-routes
    attribute: yaffo-gallery
    description: Python routes tagged for gallery feature
  - tag: timeline-sections-template
    path: templates/_timeline_sections.html
    description: Timeline day sections, month dividers and infinite-scroll sentinel
  - tag: timeline-scrubber-js
    path: static/media/timeline_scrubber.js
    description: Turns the scrubber rail into a draggable jump-to-month control
  - tag: timeline-stream-js
    path: static/media/timeline_stream.js
    description: Streams timeline batches through the sentinel and merges continuation sections
  - tag: responsive-shell
    path: static/responsive.css
    description: Shared adaptive layout; owns the narrow-screen rules every page inherits
  - tag: responsive-nav-js
    path: static/nav.js
    description: Narrow-screen Menu and the peer page-panel contract (move/restore live panel DOM)
  - tag: responsive-nav-panel-template
    path: templates/components/nav_panel.html
    description: Declares a page panel and its peer navbar button; the registration contract
  - tag: responsive-sidebar-template
    path: templates/_sidebar.html
    description: Filter sidebar; Actions and Filters register as separate panels
  - tag: gallery-styles
    path: static/index.css
    description: Grid, timeline and scrubber layout, plus the touch/narrow jump control that replaces the drag rail

scenarios:
  - name: gallery_loads_with_valid_images
    goal: Gallery displays photos and all image sources are valid (no broken links)
    priority: high
    steps:
      - Navigate to the home page
      - Wait for the gallery grid to be visible
      - Collect all image elements in the gallery
      - Verify each image source returns HTTP 200
    verify:
      - Gallery grid container is visible
      - At least one photo is displayed
      - All photo image sources return HTTP 200 (no broken links)
      - No images are using the fallback placeholder
  - name: gallery_loads_with_valid_videos
    goal: Gallery displays videos and all videos are valid (no broken links)
    priority: high
    steps:
      - Navigate to the home page
      - Wait for the gallery grid to be visible
      - Collect all video elements in the gallery
      - Play the first video in the gallery
      - Pause the first video in the gallery
    verify:
      - Gallery grid container is visible
      - At least one video is displayed
      - All video image sources return HTTP 200 (no broken links)
      - No images are using the fallback placeholder
  - name: gallery_filter_year_works
    goal: Should be able to find photos by filtering for year on the gallery page
    priority: high
    steps:
      - Navigate to the home page
      - Select a year from the Year filter
      - Click Apply Filters
      - Click Clear button

    verify:
      - Gallery grid container is visible
      - At least one year is in the filter dropdown
      - When the filter is applied all images are from that year
      - When the filter is cleared all the images are shown
  - name: gallery_page_navigation_works
    goal: Verify that the page navigation works
    priority: high
    steps:
      - Navigate to the home page
      - Set page size to 10
      - Click the next button
      - Click the first button
      - Click the last button

    verify:
      - Gallery grid container is visible
      - When viewing the first page 10 images are shown
      - When viewing the last page only the the remainder of the images are shown
      - Page navigations buttons work correctly
  # DETERMINISM NOTE: the library view (grid/timeline) is a SERVER-SIDE preference —
  # any request with ?view=<x> saves <x>, and a bare request renders the saved value.
  # Tests must therefore (a) always navigate with an explicit ?view= param instead of
  # relying on the saved state, and (b) run this feature's tests serially in one
  # worker (test.describe.configure({ mode: 'default' })) so the only test that reads
  # the saved value (timeline_view_preference_persists) cannot race a writer.
  - name: timeline_view_shows_day_sections
    goal: Timeline view groups photos into day sections with month dividers
    priority: high
    steps:
      - Navigate to the home page with ?view=timeline
      - Wait for the timeline container to be visible
    verify:
      - The Timeline toggle button is marked active and the Grid button is not
      - The page header reports the total photo count (not "Showing N of M")
      - At least one timeline day section is visible with a day header and item count
      - Each day section only contains photos taken on that day
      - Month dividers appear when the month changes between day sections
      - All photo image sources in the visible sections return HTTP 200
      - The pagination controls are not shown in timeline view
  - name: timeline_infinite_scroll_streams_more_photos
    goal: Scrolling to the bottom of the timeline streams in the next batch of photos
    priority: high
    steps:
      - Navigate to the home page with ?view=timeline&page-size=10 (forces multiple batches)
      - Count the photos currently rendered in the timeline
      - Scroll to the bottom of the page so the timeline sentinel is revealed
      - Wait for the next batch to load and repeat until the sentinel is gone
    verify:
      - More photos are rendered after scrolling than before
      - No day section header is duplicated when a batch continues the same day (continuation sections merge into the previous section)
      - Scrolling repeatedly eventually renders the full library (photo count matches the header total) and the sentinel disappears
  - name: timeline_scrubber_jumps_to_date
    goal: The date scrubber lets the user jump to a specific year/month in the timeline
    priority: high
    steps:
      - Navigate to the home page with ?view=timeline&page-size=10
      - Wait for the timeline scrubber to be visible
      - Press the scrubber rail near its bottom (the oldest end); the scrubber JS owns the pointer gesture and navigates to the month at that position
    verify:
      - The scrubber rail shows density bars and at least one year label
      - Year marks are links whose hrefs carry view=timeline and a #month-YYYY-MM anchor (the no-JS fallback)
      - After the jump the URL carries a #month-YYYY-MM anchor, that month divider is visible, and day sections from that month are rendered
  - name: timeline_view_preference_persists
    goal: The selected library view is remembered across visits
    priority: medium
    steps:
      - Navigate to the home page with ?view=timeline (this saves the preference)
      - Navigate to the home page without any view query parameter
      - Click the Grid button in the view toggle
      - Navigate to the home page without any view query parameter again
    verify:
      - The bare home page renders in timeline view after the timeline visit
      - After switching back to Grid the bare home page renders the grid view again
    cleanup:
      - Always restore the grid preference (request /?view=grid in a finally block) so other suites that hit '/' bare see the default
  - name: timeline_respects_filters
    goal: Filters applied in timeline view constrain the timeline and keep the timeline view active
    priority: medium
    steps:
      - Navigate to the home page with ?view=timeline
      - Select a year from the Year filter
      - Click Apply Filters
      - Click the Clear Filters button (navigates to bare '/', which falls back to the saved timeline preference)
    verify:
      - After applying the filter the page stays in timeline view (the filter form carries view=timeline as a hidden input)
      - All day sections shown are from the selected year
      - The header photo count matches the number of photos rendered
      - After clearing the filter the full timeline is shown again in timeline view
    cleanup:
      - Restore the grid preference (request /?view=grid)
  # ---------------------------------------------------------------------------
  # Responsive coverage. Home is the reference implementation of the shared
  # shell (docs/development/responsive.md), so the shell contract is verified
  # here; every other page family verifies its own panels in its own spec.
  # Shared helpers live in generated_tests/_support/responsive.ts.
  # ---------------------------------------------------------------------------
  - name: gallery_fits_every_contract_viewport
    goal: The gallery and the shell around it never scroll the page sideways
    priority: high
    steps:
      - Load the home page at 320x568, 390x844, 768x1024, 1024x768 and 1440x900
      - At each size record any element wider than the document
    verify:
      - The document scroll width equals its client width at every size
      - The navbar is visible at every size
      - A failure names the offending elements, not just the fact of the overflow
  - name: gallery_menu_is_reachable_on_a_narrow_screen
    goal: Every primary destination stays reachable once the navbar collapses
    priority: high
    steps:
      - Load the home page at 390x844
      - Open the Menu button
      - Press Escape
    verify:
      - Before opening, the collapsed menu is hidden and takes up no layout space
      - Opening reveals all nine primary destinations
      - Escape closes the menu
  - name: gallery_filters_use_a_peer_navbar_panel
    goal: Filters is a peer of Menu, not a disclosure nested inside the page or the Menu
    priority: high
    steps:
      - Load the home page at 390x844
      - Open Filters, then open Menu, then open Filters again
      - Type a value into the filter form, then resize to 1440x900
    verify:
      - The Filters button sits beside Menu in the same navbar row, at least 8px apart, each at least 44px tall
      - Only one of Menu or Filters is open at a time
      - The open panel carries a themed active state distinct from its closed background
      - The panel drops the desktop sidebar padding and box-shadow while it is in the navbar
      - Escape closes the panel
      - After resizing to desktop both toggles are hidden, the sidebar is back in the page, and the typed value survived
  - name: gallery_narrow_ui_is_closed_before_javascript_runs
    goal: Navigating between pages never flashes the menu or a filter panel open
    priority: high
    steps:
      - Load the home page at 390x844 with JavaScript disabled
    verify:
      - The Menu button is visible
      - The primary navigation, the custom-pages strip and the filter panel are all hidden by CSS alone
  - name: gallery_filters_button_counts_applied_filters
    goal: A closed Filters button says how many filters are narrowing the view
    priority: medium
    steps:
      - Load the home page at 390x844 with no filters
      - Load it again with a favourite filter, two person values and a page number
    verify:
      - With no filters applied the count badge is hidden
      - With filters applied the badge reads 2 - a multi-valued filter counts once and a pagination parameter does not count at all
  - name: gallery_pagination_is_one_icon_row_on_mobile
    goal: Pagination stays on a single reachable row at the minimum width
    priority: high
    steps:
      - Load the home page at 390x844 with a page size of 10
      - Click Next
      - Resize to 1440x900
    verify:
      - All four controls (First, Previous, Next, Last) share one row, are 44px wide, and show an icon instead of text
      - Paging to the next page does not leave the menu open
      - At desktop width the text labels return and the icons are hidden
  - name: gallery_filter_configurator_fits_a_narrow_viewport
    goal: The configure-filters dialog is usable at the minimum width
    priority: high
    steps:
      - Load the home page at 320x568, open Filters, then open Configure filters
      - Press Escape
    verify:
      - The dialog fits inside the viewport with an edge gutter
      - The modal body is the only scroll region, contains its own overscroll, and its action row wraps
      - Escape closes the dialog and leaves the filter panel open behind it
  - name: gallery_filter_order_can_be_changed_by_touch
    goal: Reordering filters works with a real touch drag, not only a mouse
    priority: medium
    steps:
      - Load the home page in a coarse-pointer context at 390x844
      - Open Filters, then Configure filters
      - Drag the first row's handle below the second row using a real emulated touch stream
    verify:
      - The drag handle is at least 44x44
      - The first two rows swap order and no row is left in the dragging state
  - name: gallery_survives_rtl_zoom_and_short_landscape
    goal: The shell stays contained in the awkward viewport and locale cases
    priority: medium
    steps:
      - Load the home page at 390x844 and switch the document direction to rtl
      - Load it at 844x390 and double the root font size
      - Open the Menu at each
    verify:
      - Neither case introduces page-level horizontal overflow
      - The Menu opens and its destinations are visible in both cases
  - name: gallery_shell_holds_up_in_every_built_in_theme
    goal: Theme skins decorate the narrow shell without changing its geometry
    priority: medium
    steps:
      - At 390x844, load each built-in theme (classic, darkroom, memphis, neobrutalist, photos-app, scrapbook)
    verify:
      - Each theme renders with no page-level horizontal overflow
      - The active theme is reflected on the html element
  - name: every_page_registers_its_panels_the_same_way
    goal: There is one narrow-screen navigation system, not two
    priority: high
    steps:
      - At 390x844, visit each primary page family
    verify:
      - No page renders a generated .responsive-panel-toggle disclosure (the legacy initializer is retired)
      - Every element marked data-nav-panel has an id and exactly one peer button pointing at it
      - The number of registered panels equals the number of peer buttons on every page
  - name: gallery_choosing_a_filter_value_keeps_the_panel_open
    goal: Picking a value inside the mobile filter panel does not dismiss the panel
    priority: high
    steps:
      - Load the home page at 390x844 and open Filters
      - Open the Year select and choose a year
    verify:
      - The Filters panel is still open and the panel button still reports itself as open
      - The chosen year is applied to the underlying select
      - REGRESSION - the searchable select rebuilds its option list on change, which detaches the
        clicked node while the click is still bubbling; the navbar's outside-click dismissal must
        judge the click by its event path, not by whether the target is still in the document
  - name: gallery_filter_controls_sit_inline_with_their_labels
    goal: Checkbox and radio filter controls line up with their own text
    priority: medium
    steps:
      - Load the home page at 390x844, open Filters, and open a multi-select filter
    verify:
      - A multi-select option renders as a flex row with its checkbox vertically centred against its text and an 8px gap
      - A match-type option ("Any of these" / "All of these") renders as a flex row with its radio vertically centred against its text and a 5px gap
      - REGRESSION - the sidebar's field-label rule must not match labels that a component renders
        inside a filter group, or it outranks their own layout and they collapse to block flow
  - name: gallery_timeline_offers_a_touch_safe_jump_control
    goal: A thumb can reach a date in the timeline without the drag rail
    priority: high
    steps:
      - Load the timeline in a coarse-pointer context at 390x844
      - Scroll the timeline down
    verify:
      - REGRESSION - the scrubber rail was simply hidden below 900px, leaving a touch screen
        with no way to jump to a date at all; a drag on a 44px strip pinned to the window edge
        must never be the only path
      - The drag rail is hidden and a row of per-year jump links is shown in its place
      - Each jump link is at least 44x44
      - The jump row is its own horizontal scroller, so a long-running library does not widen the page
      - The row sticks below the navbar and is still on screen after the timeline is scrolled
  - name: gallery_timeline_jump_control_lands_below_the_sticky_navbar
    goal: Tapping a year lands on that month, clear of the sticky chrome
    priority: high
    steps:
      - Load the timeline with a page size of 10 in a coarse-pointer context at 390x844
      - Tap the oldest year in the jump row
    verify:
      - The URL carries a #month-YYYY-MM anchor and that month's divider is rendered
      - REGRESSION - the server-rendered year links omitted page-size, so with a non-default page
        size they navigated to a page the server paginated differently and the anchor pointed at
        nothing (the JS drag path never hit this - it builds its URL from the current location)
      - The divider lands below the sticky navbar AND the jump row stuck under it
  - name: gallery_timeline_fits_every_contract_viewport
    goal: Timeline day sections stay contained at every supported width
    priority: high
    steps:
      - Load the timeline at 320x568, 390x844, 768x1024, 1024x768 and 1440x900
      - At 390x844, scroll the timeline
    verify:
      - No page-level horizontal overflow at any size, and day sections render at each
      - The sticky day header clears the navbar and the jump row stuck below it, instead of sliding under them
  - name: gallery_timeline_streaming_survives_rotation
    goal: Photos streamed into the timeline are not lost when the device rotates
    priority: high
    steps:
      - Load the timeline at 390x844 with a page size of 10
      - Reveal the sentinel so the next batch streams in
      - Rotate to 844x390 without reloading
    verify:
      - The photo count after rotation equals the count that had streamed in
      - No page-level horizontal overflow in the rotated layout
      - No section is left in the continuation state
  - name: gallery_card_details_have_a_coarse_pointer_path
    goal: Card affordances that depend on hover still work on a touch screen
    priority: high
    steps:
      - Load the grid in a coarse-pointer context at 390x844
      - Tap the favourite heart on the first card twice
    verify:
      - The hover detail overlay is not rendered on a coarse pointer - it either never opens or
        opens on tap and sticks over the thumbnail it describes; the card's own tap target opens
        the detail page, which shows the same information
      - REGRESSION - the favourite heart was faded in by card hover, so on a touch screen the only
        way to favourite from the grid was an invisible 40px target
      - The heart is visible, is at least 44x44, and toggles on tap and back again
