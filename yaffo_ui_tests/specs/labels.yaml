feature: labels
description: User can manage the classification-label vocabulary, have photos auto-labeled by the classify-labels automation, and browse/filter photos by their labels

tags:
  - core

preconditions:
  - Application is running with the taskq worker (label classification runs as a background job)
  - Database contains sample photos and the seeded default label vocabulary + system automations
  - CLIP model assets are available locally (offline image recognition) for the classification scenarios

context:
  - tag: settings-labels-template
    path: templates/settings/_labels.html
    description: Settings vocabulary panel — label chips with enable toggles, filter box, add-label form, and the re-classify backfill button
  - tag: settings-labels-js
    path: static/settings/labels.js
    description: Client wiring for the vocabulary panel (chip filter box)
  - tag: settings-routes
    path: routes/settings.py
    description: HTMX endpoints — /settings/labels (create/toggle/delete keyed by `action`) and /settings/labels/reclassify (backfill)
  - tag: labels-filter-template
    path: templates/filters/_labels.html
    description: Gallery sidebar Label filter — multi-select with any/all match type
  - tag: media-view-template
    path: templates/media/view.html
    description: Photo details page — the Labels section renders assigned labels as chips with a confidence tooltip
  - tag: classify-labels-task
    path: background_tasks/tasks/classify_labels_automation.py
    description: The classify_labels system automation task — zero-shot CLIP scoring against the enabled vocabulary

data:
  - A fresh install seeds ~64 default vocabulary entries (is_default) such as dog, beach, sunset; users add/remove/disable their own from Settings
  - Labels are auto-generated by the classifier and replaced wholesale per photo on re-classification — distinct from Tags (manual, freeform key/value)
  - A label's optional prompt is the phrase CLIP matches against; blank falls back to "a photo of <name>"; names/prompts must be English
  - The vocabulary panel is HTMX-driven — create/delete re-render the section, toggle is fire-and-forget (204, checkbox state is the feedback), validation errors arrive as error toasts without a swap
  - The classify_labels automation is a system automation (event trigger media_indexed) with configurable strictness threshold and max labels per photo
  - Re-classify enqueues one background job over all indexed photos and reports "Re-classifying N photos in the background…"

scenarios:
  - name: labels_vocabulary_shows_default_labels
    goal: The Settings page lists the seeded label vocabulary and the filter box narrows it
    priority: high
    steps:
      - Navigate to the Settings page
      - Locate the "Photo labels" section
      - Type a term into the label filter box (e.g. "dog")
    verify:
      - The section lists the default vocabulary as label chips with enable checkboxes
      - Filtering hides non-matching chips and shows only matches
      - Filtering by a nonsense term shows the "No labels match your filter" message
      - Clearing the filter restores the full list

  - name: labels_vocabulary_add_and_remove_label
    goal: The user can add a custom label (with an optional prompt) and remove it
    priority: high
    steps:
      - Navigate to the Settings page and locate the "Photo labels" section
      - Fill in a unique label name and an optional prompt in the add-label form
      - Submit the form
      - Remove the label that was just added via its chip's remove button
    verify:
      - After adding, the new label chip appears in the vocabulary (section re-renders via HTMX)
      - The new chip shows a prompt info tip when a prompt was provided
      - Submitting a duplicate name shows an error toast and keeps the typed input
      - After removing, the chip no longer appears in the vocabulary
    cleanup:
      - Remove the added label if it still exists

  - name: labels_vocabulary_toggle_label
    goal: The user can enable/disable a vocabulary label and the state persists
    priority: medium
    steps:
      - Navigate to the Settings page and locate the "Photo labels" section
      - Uncheck an enabled label chip's checkbox
      - Reload the page
    verify:
      - The checkbox state persists across the reload (toggle is persisted server-side)
    cleanup:
      - Re-enable the label that was toggled off

  - name: labels_classify_automation_configurable
    goal: The classify-labels system automation is listed and its strictness/max-labels config can be edited
    priority: medium
    steps:
      - Navigate to the Automations page
      - Select the "Classify labels" automation
      - Open Configure, change a config value (e.g. max labels), and save
    verify:
      - Classify labels appears as a system automation (no Edit/Delete) with a media_indexed event trigger
      - The configure modal exposes the strictness threshold and max-labels fields
      - After saving, the page reflects the new configuration value
    cleanup:
      - Restore the original configuration values

  - name: labels_reclassify_all_photos
    goal: The user can trigger a re-classification backfill over all indexed photos
    priority: high
    steps:
      - Navigate to the Settings page and locate the "Photo labels" section
      - Click "Re-classify all photos"
      - Wait for the background job to finish
    verify:
      - A toast reports "Re-classifying N photos in the background…"
      - The run appears in the classify-labels automation's run history
      - After the job completes, photos show labels from the enabled vocabulary

  - name: photo_details_shows_labels
    goal: A classified photo's details page lists its labels with confidence
    priority: medium
    steps:
      - Ensure photos have been classified (run the re-classify backfill if needed)
      - Open the details page of a photo that received labels
    verify:
      - The Labels section header shows the label count (singular/plural — "Label (1)" vs "Labels (N)")
      - Each label renders as a chip with a confidence tooltip
      - An unclassified photo shows the "No labels" message instead

  - name: gallery_filter_by_label
    goal: The user can filter the gallery by one or more labels with any/all matching
    priority: medium
    steps:
      - Ensure photos have been classified (run the re-classify backfill if needed)
      - On the gallery page, open the Label filter multi-select and pick a label a photo carries
      - Apply the filters
      - Add a second label and switch the match type between any and all, re-applying
    verify:
      - With one label selected, only photos carrying that label are shown
      - Match type "any" shows photos carrying either label; "all" narrows to photos carrying both
      - Clearing the filters restores the full gallery
