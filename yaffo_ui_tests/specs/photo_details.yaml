feature: photo_details
description: User can view detailed information about a photo including file info, location, people, faces, and tags

tags:
  - smoke
  - core

preconditions:
  - Application is running
  - Database contains sample photos with faces and tags

context:
  - tag: photo-view-template
    path: templates/media/view.html
    description: Photo details view template with sidebar and main image
  - tag: responsive-nav-js
    path: static/nav.js
    description: Narrow-screen Menu and the peer page-panel contract (moves/restores live panel DOM)
  - tag: responsive-nav-panel-template
    path: templates/components/nav_panel.html
    description: Declares a page panel and its peer navbar button; the registration contract
  - tag: responsive-shell
    path: static/responsive.css
    description: Shared adaptive layout; owns the narrow-screen rules every page inherits
  - tag: photo-view-styles
    path: static/media/view.css
    description: Viewer layout; owns the narrow stack, the dynamic viewport units and the coarse-pointer target sizes
  - tag: photo-view-js
    path: static/media/view.js
    description: Face highlighting on the overlay canvas (hover and tap), redrawn when the photo is resized
data:
  - Test image "2015-09-10_153200_daughter-one-year-portrait.png" has location data and should be used for filename, location, and tag tests
  - Tests resolve fixture images by filename rather than relying on database IDs
  - Face tests dynamically find a photo with detected faces
scenarios:
  - name: photo_details_displays_file_information
    goal: Photo details page shows correct file information
    priority: high
    steps:
      - Navigate to the home page
      - Click on a photo to open the details view
    verify:
      - Photo details page loads successfully
      - File name is displayed in the sidebar
      - Folder path is displayed
      - The main photo image loads correctly (HTTP 200)
      - Open File and Open Folder buttons are visible

  - name: photo_details_displays_people_and_faces
    goal: Photo details page shows people and faces associated with the photo
    priority: high
    steps:
      - Navigate to a photo that has faces assigned to people
    verify:
      - People section shows the count of people
      - Each person name is displayed as a clickable link
      - Faces section shows the count of faces
      - Face thumbnails are displayed and load correctly
      - Hovering over a face thumbnail highlights it on the main image

  - name: photo_details_can_edit_tags
    goal: User can add and edit tags on a photo
    priority: high
    steps:
      - Navigate to the photo details page
      - Click the Edit Tags button
      - In the modal, enter a tag name 'TestTag' and value 'TestValue'
      - Click the Add Tag button
      - Click Save Changes
    verify:
      - Edit Tags modal opens
      - New tag input fields are visible
      - After saving, the new tag appears in the Tags section
      - Tag displays both name and value
    cleanup:
      - Remove the tag 'TestTag' from the photo

  - name: photo_details_location_section_works
    goal: Location information is displayed when available
    priority: medium
    steps:
      - Navigate to a photo that has location data (latitude/longitude)
    verify:
      - Location section displays coordinates
      - View on Map link is present and links to Google Maps
      - Clicking View on Map opens Google Maps in a new tab with correct coordinates

  - name: photo_details_face_hover_highlights
    goal: Hovering over face thumbnails highlights the face on the main photo
    priority: medium
    steps:
      - Navigate to a photo that has detected faces
      - Hover over a face thumbnail in the sidebar
    verify:
      - Face canvas overlay becomes visible
      - The corresponding face region is highlighted on the main photo
      - Moving mouse away clears the highlight
  # ---------------------------------------------------------------------------
  # Responsive coverage (P1 — media detail). The shared shell contract itself is verified
  # in specs/photo_gallery.yaml; what follows is this family's own narrow-screen
  # behaviour. Shared helpers: generated_tests/_support/responsive.ts.
  # ---------------------------------------------------------------------------
  - name: photo_details_stacks_media_above_metadata
    goal: On a narrow screen the photo stays visible with its details reachable below
    priority: high
    steps:
      - Open a photo's detail page at 390x844
    verify:
      - The page does not scroll horizontally
      - The media container renders above the details sidebar
      - Metadata, faces, tags and the favourite control all remain reachable
      - REGRESSION - the sidebar kept its desktop framing at narrow widths (a 40vh sticky card whose
        content pane was its own scroller), so the metadata could only be reached by scrolling inside
        a box that looked like the page; the document is now the only scroller
  - name: photo_details_survives_rotation
    goal: Rotating to a short landscape viewport keeps the photo usable
    priority: medium
    steps:
      - Open a photo's detail page at 390x844
      - Resize to 844x390 without reloading
    verify:
      - No page-level horizontal overflow appears
      - The media container is still visible and no control is clipped
      - Viewport-height calculations use dynamic units so browser chrome cannot hide the actions
  - name: photo_details_fits_every_contract_viewport
    goal: The detail route never scrolls the page sideways
    priority: high
    steps:
      - Open a photo's detail page at 320, 390, 768, 1024 and 1440 px wide
    verify:
      - The document scroll width equals its client width at every size
      - The media is visible at every size
  - name: photo_details_face_highlight_works_with_a_coarse_pointer
    goal: A tap maps a face thumbnail onto the photo, as hovering does with a mouse
    priority: high
    steps:
      - Open a photo with detected faces in a coarse-pointer context at 390x844
      - Tap the first face thumbnail
    verify:
      - REGRESSION - the face box was drawn only from the thumbnail's mouseenter, which a touch
        screen never fires, so the whole face-to-photo mapping was unreachable with a coarse pointer
      - The thumbnail is marked highlighted and the overlay canvas is painted
  - name: photo_details_face_highlight_survives_rotation
    goal: Rotating the device redraws the face box instead of silently dropping it
    priority: medium
    steps:
      - Tap a face thumbnail at 390x844 in a coarse-pointer context
      - Rotate to 844x390 without reloading
    verify:
      - REGRESSION - resizing the canvas to the photo's new rendered size wipes it, so a rotation
        left the thumbnail marked highlighted with no box on the photo
      - The thumbnail is still highlighted and the overlay is painted again at the new scale
  - name: photo_details_tag_editor_fits_a_narrow_viewport
    goal: The tag dialog is usable at the minimum width
    priority: high
    steps:
      - Open a photo's detail page at 320x568 and click Edit Tags
    verify:
      - The dialog fits inside the viewport and the page does not overflow
      - REGRESSION - the two tag inputs and the Add button shared one flex row, so at 320px each
        input collapsed to a few pixels; the row stacks instead
      - The modal body is the only scroll region
  - name: photo_details_long_path_does_not_widen_the_page
    goal: A deep unbroken folder path wraps rather than widening the page
    priority: medium
    steps:
      - Open a photo's detail page at 320x568
      - Replace the folder value with a 300-character path that has nothing to wrap at
    verify:
      - The document scroll width still equals its client width
  - name: photo_details_video_fits_a_narrow_viewport
    goal: A video detail page contains its player at a narrow width
    priority: medium
    steps:
      - Open a seeded video's detail page at 390x844
    verify:
      - The player (or the missing-media notice) is visible and fits inside the viewport
      - No page-level horizontal overflow and no nested scroll region
  - name: photo_details_missing_video_state_fits_a_narrow_viewport
    goal: A video that disappeared from disk still has a usable detail page
    priority: medium
    steps:
      - Open a seeded video's detail page at 390x844
      - Temporarily move its source file out of the way and reload the same page
    verify:
      - The missing-media notice and filename are visible
      - The notice fits inside the viewport
      - No page-level horizontal overflow and no nested scroll region
  - name: photo_details_metadata_actions_are_touch_sized
    goal: Every metadata action on the viewer is operable with a finger
    priority: medium
    steps:
      - Open a photo with faces in a coarse-pointer context at 390x844
    verify:
      - REGRESSION - a person chip is the only route from this photo to that person, and the shared
        coarse-pointer sizing does not reach a bare anchor, so it stayed a 28px pill on a touch screen
      - Person links, Open File, Open Folder, Reindex, Edit Tags and View on Map are all at least 44px tall
      - The page does not scroll horizontally
