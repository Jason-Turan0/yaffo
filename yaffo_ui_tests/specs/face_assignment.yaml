feature: face_assignment
description: User is shown all the faces that have not been assigned to people
tags:
  - smoke
  - core
context:
  - tag: face_assignment-template
    path: templates/faces/index.html
    description: Main template for face assignment
  - tag: face_assignment
    attribute: yaffo-face_assignment
    description: Context for face assignment feature
  - tag: responsive-nav-js
    path: static/nav.js
    description: Narrow-screen Menu and the peer page-panel contract (moves/restores live panel DOM)
  - tag: responsive-nav-panel-template
    path: templates/components/nav_panel.html
    description: Declares a page panel and its peer navbar button; the registration contract
  - tag: responsive-shell
    path: static/responsive.css
    description: Shared adaptive layout; owns the narrow-screen rules every page inherits
data:
  - The Bennett fixture leaves detected faces unassigned so the assignment workflow has a realistic pool
  - Tests discover faces from the current similarity groups because indexed face ids are not fixture-stable
scenarios:
  - name: face_assignment_can_create_new_people
    goal: Should be able to create a new person using the quick action section
    priority: high
    steps:
      - Navigate to the face assignment page
      - If there is a person named Obama in the person dropdown
      - Then goto the people page and delete 'Obama' then return to the face assignment screen
      - Type in the name 'Obama' into the textbox and click the 'Create Person' button
    verify:
      - No error messages are shown
      - A confirmation toast message is displayed
      - There is a person named Obama in the person dropdown
  - name: face_assignment_can_be_done
    goal: Should be able to assign faces to people
    priority: high
    steps:
      - Create a person named 'Obama' if needed
      - Update the filter to group by People and click the 'Apply Filter' button
      - Click Clear selection and the select one of the photos that belong to Obama
      - Select Obama from the 'Assign to Person' dropdown
      - Click one face from the first suggested group
      - Click the Assign Selected button

    verify:
      - The selected face is removed from the view
      - Success message is displayed
      - The selected face is assigned to Obama on the people -> view faces screen
    cleanup:
      - Delete person Obama
  - name: faces_are_automatically_matched_to_people_based_on_similarity
    goal: After assigning at least one face to a person similar faces to that person should be suggested automatically
    priority: high
    steps:
      - Create a person named 'Obama' and assign a face from a live similarity group to him
      - Update the filter to group by People
      - Set the similarity threshold to 2
      - Click the Apply Filters button
    verify:
      - There is a group for person 'Obama'
      - All the faces in the group of one of the expected face ids for Obama
      - All the faces are in the first group are selected
      - None of the faces in the Unknown group are selected
    cleanup:
      - Delete person Obama
  - name: similar_faces_are_grouped_together
    goal: When grouping faces by similarity it should be able to suggest a group of faces
    priority: high
    steps:
      - Update the filter to group by Similarity
      - Set the similarity threshold to 2
      - Click the Apply Filters button
    verify:
      - Some groups are displayed
      - All groups should have at least three faces
      - The first group is automatically selected to allow for quick assignment
  - name: keyboard_shortcuts_enable_quick_face_assignment
    goal: Users can quickly assign faces using keyboard shortcuts without clicking buttons
    priority: high
    steps:
      - Navigate to the people page and create a person named 'TestKeyboardPerson'
      - Navigate to the face assignment page
      - Update the filter to group by People
      - Set the similarity threshold to 2
      - Click the Apply Filters button
      - Note the keyboard shortcut number displayed next to 'TestKeyboardPerson' in the sidebar
      - Press the number key corresponding to 'TestKeyboardPerson'
    verify:
      - The selected faces are assigned to 'TestKeyboardPerson'
      - A success message is displayed
      - The next group is automatically selected for quick assignment
      - The faces that were assigned are no longer visible in the current view
    cleanup:
      - Navigate to the people page
      - Delete the person 'TestKeyboardPerson'
  - name: face_page_navigation_works
    goal: Verify that the page navigation works
    priority: high
    steps:
      - Navigate to the faces page
      - Group by people to show all faces
      - Set page size to 25
      - Click the next button
      - Click the first button
      - Click the last button

    verify:
      - Gallery grid container is visible
      - When viewing the first page 25 faces are shown
      - When viewing the last page only the the remainder of the faces are shown
      - Page navigations buttons work correctly
      - Filters are maintained when selecting page controls
  # ---------------------------------------------------------------------------
  # Responsive coverage (P3 — faces). The shared shell contract itself is verified
  # in specs/photo_gallery.yaml; what follows is this family's own narrow-screen
  # behaviour. Shared helpers: generated_tests/_support/responsive.ts.
  # ---------------------------------------------------------------------------
  - name: faces_exposes_actions_and_filters_as_separate_peers
    goal: A page with both Actions and Filters gets one peer button each, in that order
    priority: high
    steps:
      - Load the faces page at 390x844
      - Open Actions, then Filters
    verify:
      - Actions and Filters are both peers of Menu, with Actions first
      - Opening one closes the other and closes Menu
      - Neither panel scrolls the page horizontally
      - The Filters button carries an applied-filter count badge
  - name: faces_filter_panel_preserves_state_across_a_resize
    goal: The faces filter panel follows the shared panel contract end to end
    priority: high
    steps:
      - Load the faces page at 390x844, open Filters, enter a value
      - Press Escape, reopen, then resize to 1440x900
    verify:
      - Escape closes the panel
      - At desktop width both toggles are hidden and the sidebar is back in the page
      - The entered value survived the move
  - name: faces_source_preview_opens_with_a_coarse_pointer
    goal: The hover-only face source preview has a touch equivalent
    priority: high
    steps:
      - Load the faces page in a coarse-pointer context at 390x844
      - Tap the preview control on the first face, then tap it again
    verify:
      - The preview control is visible on a coarse pointer
      - Tapping shows the source preview and tapping again hides it
      - The face's selected state is unchanged by opening the preview
      - The preview does not push the page wider than the viewport
  - name: faces_group_by_radios_sit_inline_with_their_labels
    goal: The Group by radio options line up with their own text
    priority: medium
    steps:
      - Load the faces page at 390x844 and open the Filters panel
    verify:
      - Each Group by radio option renders as a flex row with its radio vertically centred against its text and an 8px gap

