# User guide automation — hand-authored spec.
#
# This file holds ONLY what cannot be derived from the docs or generated by the
# bot. Deliberately absent:
#
#   * what a screenshot depicts   -> the alt text in the markdown
#   * which images a page owns    -> grep that page for image references
#   * where an image is stored    -> always docs/guide/{area}/assets/{page}/
#   * how to capture a shot       -> {area}/{page}/{page}.ts, bot-generated
#   * what a page depends on      -> {area}/{page}/{page}.lock.json, recorded on capture
#
# There are no shared images. Every image belongs to exactly one page, even when
# two pages show the same view; each page's walkthrough captures its own copy. This
# costs a few duplicated files and buys unambiguous ownership - and lets the two
# copies diverge when a tour page wants a tighter crop than a reference page.
#
# Scope is docs/guide/** only. docs/index.md (the site landing page) is out of
# scope, in line with docs/development plans staying hand-written.
#
# See yaffo_ui_tests/docs/documentation_automation.md for the full design.

version: 1

# One entry per guide page. Most pages have a walkthrough, even when they show no
# screenshots: it drives the flows the page describes and records dependencies.
#
#   covers           the page's obligation, not its current contents. This is
#                    compared this against the app's real surface to find gaps.
#   walkthrough      true when the page has a walkthrough folder at
#                    {area}/{page}/; false for prose-only pages and runbooks
#                    that do not have a dedicated capture flow.
#   also_depends_on  source files the prose describes but no walkthrough can reach.
pages:

  start-here/getting-started:
    covers: >-
      Install through first indexed photos: prerequisites, pipx install, the
      setup helper, launching, the tray icon on each OS, adding media folders,
      running the first index, and a first look at the gallery and detail view.
      A tour: it shows the same views the deeper pages cover, in its own shots.
    walkthrough: true
    also_depends_on:
      - yaffo/setup.py        # `yaffo setup`, asset download, desktop shortcut
      - yaffo/launcher.py     # `yaffo`, tray icon, default port
      - pyproject.toml        # Python version, package name, entry points

  start-here/concepts:
    covers: >-
      Every term the rest of the guide uses without defining - library, media
      item, index, face, person, label, tag, favorite, album, custom page,
      automation, sync, service, account, theme, paired device, and share. Explain
      how importing, sending, and sharing relate to the local library. A new
      first-class concept in the model is a gap.
    walkthrough: true
    also_depends_on:
      - yaffo/db/models.py    # the entities the glossary names

  start-here/ask-yaffo:
    covers: >-
      The built-in assistant: opening it (panel, full page, conversations),
      contextual Ask Yaffo on errors and failed jobs, how-to answers with
      sources, library questions answered by scripts, links and open buttons,
      troubleshooting checks and their activity lines, change cards (approve,
      decline, large and on-disk confirmations, expiry, undo), what it can change
      by default, and reading public HTTPS pages by URL with conversation-scoped
      domain approval cards (allow selected domains, deny, reuse an approval,
      and start a fresh conversation). Cover website sources and expandable
      redacted results, the default-on Read public websites switch, disabling
      web access, what is sent to the AI provider, and what it won't do.
    walkthrough: true
    also_depends_on:
      - yaffo/background_tasks/automation_sandbox/automation_host.py  # what it can change
      - yaffo/site_agents/assistant/prompt_generator/prompt.py        # what it can check
      - yaffo/site_agents/assistant/redact.py                         # what is sent
      - yaffo/site_agents/assistant/plans.py                          # expiry, confirmations, undo
      - yaffo/site_agents/assistant/settings.py                       # capability defaults
      - yaffo/site_agents/assistant/tool_providers/web_tool.py         # bounded, redacted web reads
      - yaffo/db/repositories/assistant_web_repository.py             # approval scope and denials
      - yaffo/sync/fetch_docs.py                                      # HTTPS and redirect boundaries

  library-basics/indexing-library:
    covers: >-
      The whole indexing lifecycle: adding media folders, scanning, syncing new
      and changed and orphaned files, watching background jobs, re-indexing after
      changes, and the list of supported media formats.
    walkthrough: true
    also_depends_on:
      - yaffo/common.py       # PHOTO_EXTENSIONS / VIDEO_EXTENSIONS back "Supported Media"
      - yaffo/utils/file_sync.py  # scan, orphan, and sync semantics
      - yaffo/utils/index_jobs.py # import and reindex job creation
      - yaffo/background_tasks/watcher.py  # live filesystem changes
      - yaffo/background_tasks/tasks/file_sync.py  # scheduled reconciliation
      - yaffo/scripts/db/migrations/000_MIGRATION_20260620_INIT.py  # hourly schedule

  library-basics/browsing-filtering:
    covers: >-
      Every filter group in the sidebar, any/all matching, clearing filters,
      configuring which groups are visible, the grid and timeline views, and what
      to do when results look wrong. A new filter is a gap.
    walkthrough: true
    also_depends_on:
      - yaffo/routes/filter_config.py   # the canonical filter group list

  library-basics/photo-details:
    covers: >-
      Every panel of the detail view: the preview for photos and for playable and
      non-playable video, file information, opening the original file or folder,
      favoriting, location, people and faces, labels, tags, and the keyboard
      shortcut.
    walkthrough: true
    also_depends_on:
      - yaffo/common.py  # playable versus externally opened video containers
      - yaffo/background_tasks/tasks/export_photo_tag.py  # optional metadata export

  library-basics/organizing-photos:
    covers: >-
      How filters, favorites, tags, people, labels, locations, duplicate review,
      albums, and custom pages relate to one another, plus one practical end-to-end
      workflow. A hub page: it explains relationships rather than screens.
    walkthrough: true
    also_depends_on:
      - yaffo/db/models.py  # the entities and relationships this hub explains

  organize-review/faces-and-people:
    covers: >-
      What the face review page shows, creating people, reviewing one person's
      faces, and automatic assignment. Background for the assignment workflow.
    walkthrough: true
    also_depends_on:
      - yaffo/domain/life_stages.py  # why a person's birthdate improves matching
      - yaffo/background_tasks/tasks/auto_assign_faces_automation.py  # assignment policy
      - yaffo/scripts/db/migrations/000_MIGRATION_20260620_INIT.py  # built-in trigger and defaults

  organize-review/assigning-faces:
    covers: >-
      The day-to-day assignment workflow end to end: opening Faces, choosing how
      faces are grouped and the similarity threshold, assigning a cluster,
      working through several clusters, quick assignment, ignoring faces, and
      refreshing between passes.
    walkthrough: true

  organize-review/labels:
    covers: >-
      How classification works, managing the vocabulary, adding custom labels,
      re-classifying, filtering by label, and reviewing labels on a photo. The
      shipped default vocabulary is enumerable and must stay accurate.
    walkthrough: true
    also_depends_on:
      - yaffo/scripts/db/migrations/000_MIGRATION_20260620_INIT.py  # seeded vocabulary
      - yaffo/background_tasks/automation_config.py  # confidence and per-photo limits
      - yaffo/background_tasks/tasks/classify_labels_automation.py  # offline classification policy
      - yaffo/db/repositories/classification_repository.py  # enabled vocabulary and assignments

  organize-review/locations:
    covers: >-
      The map: markers and clusters, selecting photos, previewing a selection,
      assigning and clearing location names, recommendations, filtering the map,
      and the empty state.
    walkthrough: true
    also_depends_on:
      - yaffo/routes/filter_config.py  # the canonical filter group list
      - yaffo/background_tasks/automation_config.py  # nearby-name radius semantics
      - yaffo/utils/reverse_geocode.py  # external recommendation fallback

  organize-review/duplicates:
    covers: >-
      How duplicate detection works, starting a scan, reviewing groups, choosing
      an action, removing selected duplicates, the safety checklist, and the
      no-duplicates-found case.
    walkthrough: true
    also_depends_on:
      - yaffo/background_tasks/tasks/find_duplicates.py  # perceptual-hash grouping policy
      - yaffo/background_tasks/tasks/remove_duplicates.py  # trash/delete/move behavior
      - yaffo_ui_tests/lib/services/isolated_runner.ts  # shared duplicate sample composition

  organize-review/albums:
    covers: >-
      Albums as hand-curated collections whose membership never changes on its
      own: the albums overview and its cover tiles, creating an album, adding
      photos from the filterable add screen (picking individual photos or every
      match), the album page, reordering by drag, choosing the cover, removing
      photos, editing the name and description, sharing an album with a paired
      device, and deleting an album (which never deletes photos). Creating an
      album and filling it must be a guided walkthrough (the guide-walkthrough
      component) with one screenshot per step; other screenshots are annotated
      screenshots. The docs fixture seeds "Maya's Big Game", three volleyball
      photos from July 2026. A walkthrough that creates an album must delete it
      in teardown; reordering, cover, and removal must not change the seeded
      album.
    walkthrough: true
    also_depends_on:
      - yaffo/db/repositories/album_repository.py  # membership, order, and cover rules
      - yaffo/routes/selection.py  # "every match" selection semantics on the add screen

  create-customize/custom-pages:
    covers: >-
      Creating a page, working with widgets, and publishing and presenting it.
      The set of available widget types is enumerable and must stay complete.
      Building a page with the Assistant must be a guided walkthrough (the
      guide-walkthrough component) with one screenshot per step: + New page and
      the empty design view it opens, describing the page to the Assistant, the
      locked canvas while generation runs (elapsed timer and Cancel), reviewing
      the finished draft, saving it, and the published page in presentation mode.
      Other screenshots are annotated screenshots. The docs fixture has pages for
      each state: "Florida Trip" is published; "Maya's Third Birthday" has a READY
      draft that adds a People widget below its party-photo grid and waits for
      Save; "Chicago 2015" is still generating, its working version started at
      2026-09-01 12:00:00 UTC, so pin
      the browser clock (Playwright's page.clock) to get a stable elapsed timer.
      Never click Save, Send, Cancel, or Delete on these seeded pages: they write
      to the shared fixture. A page the walkthrough creates must be deleted in
      teardown.
    walkthrough: true
    also_depends_on:
      - yaffo/site_agents/widget_templates.py  # the complete built-in widget catalog
      - yaffo/db/repositories/custom_page_repository.py  # page/version publishing semantics
      - yaffo/background_tasks/tasks/generate_page.py  # durable assistant generation
      - yaffo/site_agents/llm_config.py  # provider and API-key requirements
      - yaffo_ui_tests/scripts/seed_database.py  # Florida Trip and the shared example page drafts

  create-customize/themes:
    covers: >-
      Choosing a theme, designing one by description, and publishing, renaming,
      and deleting it. The built-in theme list must match THEMES; a new shipped
      theme is a gap.
    walkthrough: true
    also_depends_on:
      - yaffo/themes.py       # THEMES is the authoritative built-in list

  create-customize/automations:
    covers: >-
      Every system automation and the System, Syncs, Custom, and Services sidebar
      groups. Cover all New automation choices: Custom, Import from, Send to,
      and Add a new service. Custom rules need draft, test, publish, and trigger
      workflows. Link to the dedicated importing, exporting, and photo-service
      walkthroughs. Cover scheduling, event triggers, manual runs, run history,
      disabling, and failure investigation. Explain Export photo tag's five
      opt-in fields, defaults, original-file writes, format differences, manual
      backfill, and why disabling or removing a value does not erase embedded
      metadata. Distinguish write-back from Send to syncs. A new automation or
      trigger type is a gap.
    walkthrough: true
    also_depends_on:
      - yaffo/scripts/db/migrations/000_MIGRATION_20260620_INIT.py
      - yaffo/background_tasks/automation_config.py
      - yaffo/background_tasks/tasks/export_photo_tag.py
      - yaffo/utils/write_metadata.py

  create-customize/importing:
    covers: >-
      A walkthrough from New automation and Import from to the first run.
      Cover Folder, OneDrive, Immich, Paired device, and published custom sources;
      account reuse and reauthentication, source options, import roots and layouts,
      previews and paging, setup review, nightly schedules, progress, item history,
      retrying failures, hash deduplication, indexing, and keeping copies after
      source deletions. Paired devices need pairing and sharing prerequisites,
      device/share selection, remote filters, direct and relay paths, per-run
      limits, online events, and waiting for unavailable devices or drives.
    walkthrough: true
    also_depends_on:
      - yaffo/sync/preset_seed.py
      - yaffo/sync/setup.py
      - yaffo/sync/source_run.py
      - yaffo/sync/folder_source.py
      - yaffo/sync/peer_source.py
      - yaffo/sync/connections.py

  create-customize/exporting:
    covers: >-
      A walkthrough from New automation and Send to to the first transfer.
      Cover Folder, OneDrive, Google Photos, Immich, and published custom targets;
      account reuse and reauthentication, destination options and layouts,
      conversion, album/filter/custom selections, selection-builder testing and
      publishing, previews and paging, setup review and re-enabling after changes,
      schedules and album events, batches and resumed runs, progress, item history,
      retrying failures, protected copies, destination-specific removal policies,
      remotely deleted copies, and one-direction behavior.
    walkthrough: true
    also_depends_on:
      - yaffo/sync/preset_seed.py
      - yaffo/sync/setup.py
      - yaffo/sync/target_run.py
      - yaffo/sync/folder_target.py
      - yaffo/sync/connections.py
      - yaffo/sync/presets/google_photos_target.star
      - yaffo/sync/presets/onedrive_target.star
      - yaffo/sync/presets/immich_target.star

  create-customize/photo-services:
    covers: >-
      A step-by-step walkthrough from New automation and Add a new service to a
      reusable published import or send service. Cover the saved AI model and key
      prerequisite, describing direction and behavior, Overview, Account, Access,
      Code, and Test tabs, app credentials and test accounts, documentation-domain
      and builder live-read permissions, revoking live reads, tests that record
      writes, correcting drafts, publishing and reviewing endpoints, and creating
      a sync with the published service. Explain draft versus published behavior,
      wider-access review for existing syncs, regeneration, and deletion while in use.
      The build must be a guided walkthrough (the guide-walkthrough component) that a
      reader follows in order, with one screenshot per step: the New automation
      dialog with Add a new service selected, the builder conversation with its
      Overview, the Account tab, the Access tab's endpoints, the Code tab, the Test
      tab with its options, the Publish review, and the published service offered
      under Send to in New automation. Screenshots outside the walkthrough are
      annotated screenshots. The docs fixture seeds a published "Flickr exports"
      service with a newer unpublished draft for these steps. A Test result needs a
      real signed-in account, so describe it in prose rather than picturing it.
    walkthrough: true
    also_depends_on:
      - yaffo/db/repositories/service_builder_repository.py # drafts, publishing, permissions
      - yaffo/sync/adapter_test.py                 # live reads and recorded writes in Test
      - yaffo/sync/fetch_docs.py                   # documentation-domain approval
      - yaffo/sync/connections.py                  # test accounts and shared sign-in
      - yaffo/sync/setup.py                        # published service setup and consent

  sharing/pairing-devices:
    covers: >-
      Trust without media access, generating and entering a single-use expiring
      pairing code, both devices being online, checking device IDs, local labels
      and renaming, presence states, and revoking and forgetting a device.
      Pairing must be a guided walkthrough with one screenshot per step. The docs
      sandbox must be built and started with --peer; the peer uses the primary's
      hostname and port 5003. Restore pairing after a revoke demonstration.
    walkthrough: true
    also_depends_on:
      - yaffo/p2p/pairing.py
      - yaffo/db/repositories/p2p_repository.py

  sharing/sharing-folders-albums:
    covers: >-
      Granting a paired device access to a media directory, a folder within one,
      or an album; scope boundaries, current album membership, album Share dialog,
      reviewing Shared With Others and Shared With Me, and revoking one grant.
      Pairing alone grants nothing. Existing downloaded copies survive revocation.
      Use annotated screenshots. Revoke demonstration grants after capture and
      never change the seeded album's members.
    walkthrough: true
    also_depends_on:
      - yaffo/db/repositories/p2p_repository.py
      - yaffo/p2p/handlers/sharing.py

  sharing/receiving-photos:
    covers: >-
      Browsing a granted remote gallery with filters and previews, setting a
      download directory, selecting individual files or every match across pages,
      pulling copies in the background, finding the completed copies, adding
      the download folder to Media Directories and indexing it locally, and
      unavailable-device or missing-grant cases. Distinguish a completed manual
      pull from indexing and link to paired-device imports for automatic copying
      and indexing. Pulling must be a guided
      walkthrough with one screenshot per step; the gallery is annotated.
      Sharing copies media and never moves or deletes originals. Keep the seeded
      album unchanged and revoke demonstration grants after capture.
    walkthrough: true
    also_depends_on:
      - yaffo/p2p/handlers/sharing.py
      - yaffo/p2p/transfers.py

  sharing/transfers-connections:
    covers: >-
      Transfer progress, state and per-file errors, local versus direct versus
      relayed paths, the soft relay-data budget, pausing and continuing anyway,
      cancellation, dismissing inactive records, and connection troubleshooting.
      Cancelling or dismissing keeps completed copies. Capture a real transfer;
      describe relay-only states in prose when the LAN-only sandbox cannot show
      them. Revoke demonstration grants and dismiss completed records afterwards.
    walkthrough: true
    also_depends_on:
      - yaffo/p2p/transfers.py

  reference-maintenance/settings:
    covers: >-
      Every section of the Settings screen, in the order they appear on screen.
      AI Generation must show the active saved provider/model, an initially empty
      provider dropdown, model lookup for only the chosen provider, searchable
      model choices, the info icon beside Model, and that provider's key settings.
      Cover updating the active model after selection, missing keys and lookup
      failures, and the saved or starter list fallback. Assistant settings must
      include Read public websites under What it can look at, enabled by default,
      with per-conversation domain approval explained in its info tip. A new
      section or capability switch is a gap.
    walkthrough: true
    also_depends_on:
      - yaffo/site_agents/llm_config.py               # saved model and key configuration
      - yaffo/site_agents/model_catalog.py            # discovery filters, limits, and fallback
      - yaffo/site_agents/model_clients/providers.py  # provider and starter-model registry
      - yaffo/db/repositories/llm_model_repository.py  # catalog persistence and invalidation
      - yaffo/site_agents/assistant/settings.py        # diagnostic, action, and web defaults

  reference-maintenance/comparison:
    covers: >-
      How Yaffo compares with Immich, PhotoPrism, and digiKam across deployment,
      library and media support, search, people and faces, organization and
      metadata, sharing, and automation; which tool suits which way of working;
      and where Yaffo is honestly behind.
    # No observable surface: the page is a prose comparison against other
    # projects, and its Yaffo column is claims about the product rather than a
    # view a walkthrough could drive.
    walkthrough: false

  reference-maintenance/troubleshooting:
    covers: >-
      The common failure modes and how to narrow them down: photos not appearing,
      an unavailable external drive, photos in the wrong year, stuck or slow jobs,
      faces stuck after assigning, wrong faces or labels or duplicates, map and
      location lookups failing, and AI features failing.
    walkthrough: true

  reference-maintenance/uninstalling:
    covers: >-
      Quitting Yaffo, running the uninstall helper, the keep-or-remove user data
      decision, removing the Python package, and what reinstalling restores.
    # No observable surface: the whole page is a terminal workflow.
    walkthrough: false
    also_depends_on:
      - yaffo/setup.py        # the uninstall helper
      - yaffo/shortcuts.py    # desktop shortcut removal
      - yaffo/common.py       # ROOT_DIR: what "user data" means
