<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 110">
  <!-- flash burst -->
  <g stroke="#ff70a6" stroke-width="4" stroke-linecap="square">
    <path d="M104 14v-9"/>
    <path d="M113 23h9"/>
    <path d="M110.5 16.5l6.5-6.5"/>
  </g>
  <g transform="rotate(-2 60 62)">
    <!-- offset shadow -->
    <rect x="22" y="38" width="88" height="56" fill="#121212"/>
    <!-- camera body -->
    <rect x="46" y="22" width="26" height="12" fill="#ffd23f" stroke="#121212" stroke-width="3"/>
    <rect x="18" y="34" width="88" height="56" fill="#ffd23f" stroke="#121212" stroke-width="3"/>
    <!-- lens -->
    <circle cx="62" cy="62" r="19" fill="#fff" stroke="#121212" stroke-width="3"/>
    <circle cx="62" cy="62" r="10" fill="#43bccd" stroke="#121212" stroke-width="3"/>
    <circle cx="66" cy="58" r="2.5" fill="#fff"/>
    <!-- shutter button + viewfinder -->
    <rect x="92" y="42" width="9" height="7" fill="#ff70a6" stroke="#121212" stroke-width="2.5"/>
    <rect x="26" y="42" width="12" height="9" fill="#fff" stroke="#121212" stroke-width="2.5"/>
  </g>
</svg>