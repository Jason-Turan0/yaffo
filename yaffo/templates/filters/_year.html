<div class="filter-group">
    <label for="year-select">{{ _("Year") }}</label>
    <select name="year" id="year-select" class="searchable-select">
        <option value="">{{ _("All Years") }}</option>
        {% for year in filters.years %}
        <option value="{{ year }}" {% if filters.selected_year== year %}selected{% endif %}>{{ year }}
        </option>
        {% endfor %}
    </select>
</div>
