<div class="filter-group">
    <label for="page-size">{{ _("Page Size") }}</label>
    <select name="page-size" id="page-size" class="searchable-select" data-search-disabled>
        {% for page_size in filters.page_sizes %}
        <option value="{{ page_size }}" {% if filters.page_size == page_size %}selected{%
                endif %}>{{ page_size | format_integer }}
        </option>
        {% endfor %}
    </select>
</div>
