<div class="filter-group">
    <label for="gender-select">Gender</label>
    <select name="gender" id="gender-select" class="searchable-select" data-search-disabled>
        <option value="">All Genders</option>
        {% for gender in filters.genders %}
        <option value="{{ gender.value }}" {% if filters.selected_gender== gender.value %}selected{% endif %}>{{ gender.name }}
        </option>
        {% endfor %}
    </select>
</div>
