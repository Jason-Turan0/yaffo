<div class="filter-group">
    <label for="tag-name-select">{{ _("Tag Name") }}</label>
    <select name="tag-name" id="tag-name-select" class="searchable-select" onchange="loadTagValues(this.value)">
        <option value="">— {{ _("All") }} —</option>
        {% for tag_name in filters.tag_names %}
        <option value="{{ tag_name }}" {% if tag_name == filters.selected_tag_name %}selected{% endif %}>
            {{ tag_name }}
        </option>
        {% endfor %}
    </select>
</div>
<div class="filter-group">
    <label for="tag-value-select">{{ _("Tag Value") }}</label>
    <select name="tag-value" id="tag-value-select" class="searchable-select" disabled>
        <option value="">— {{ _("Select a tag name first") }} —</option>
        {% if filters.selected_tag_value %}
        <option value="{{ filters.selected_tag_value }}" selected>{{ filters.selected_tag_value }}</option>
        {% endif %}
    </select>
</div>
