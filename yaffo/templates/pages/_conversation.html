<div class="conversation">
    <div class="conversation-header">
        <h2>Assistant</h2>
        <p class="conversation-subtitle">Collaborate to build your page.</p>
    </div>
    <div class="conversation-messages" id="conversation-messages">
        {% include "pages/_messages.html" %}
    </div>
    <div class="chat-status generation-status" id="generation-status" hidden>
        <span class="chat-spinner"></span>
        <span class="chat-status-text">Generating…</span>
        <span class="generation-elapsed" id="generation-elapsed">0:00</span>
    </div>
    <form class="conversation-input" id="conversation-form">
        <div class="form-group" style="padding-top: 8px" >
            <textarea rows="3"  type="text" name="message" id="conversation-message"
                      placeholder="Describe what you want…"></textarea>
        </div>

        <div class="editor-actions">
            <button type="submit" class="btn-primary">Send</button>
            <button type="button" id="cancel-generation-button" class="btn-danger">Cancel</button>
        </div>
    </form>
</div>
