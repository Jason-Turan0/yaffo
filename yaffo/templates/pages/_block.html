<div class="grid-stack-item" gs-id="{{ blk.id }}"
     gs-x="{{ blk.grid_x }}" gs-y="{{ blk.grid_y }}" gs-w="{{ blk.grid_w }}" gs-h="{{ blk.grid_h }}">
    <div class="grid-stack-item-content block-card">
        <div class="block-header">
            <span class="block-title">{{ blk.prompt or "New block" }}</span>
            <button type="button" class="block-delete" data-block-id="{{ blk.id }}" aria-label="Delete block">×</button>
        </div>
        <div class="block-body">
            <span class="block-placeholder">Block #{{ blk.id }}</span>
        </div>
    </div>
</div>
