<div class="photo-card {% if path.path_id in view_model.selected_photos %}selected{% endif %}"
     id="photo-{{ path.path_id }}"
     hx-post="{{ url_for('utilities_remove_duplicates_toggle_photo') }}"
     hx-vals='{"target_path_id": "{{ path.path_id }}", "target_path": "{{ path.path }}"}'
     hx-target="#photo-{{ path.path_id }}"
     hx-swap="outerHTML"
     hx-include="closest form">
    {% if path.is_video and path.browser_playable %}
    <video src="{{ url_for('media_by_path', mediaPath=path.path) }}" preload="metadata" muted aria-label="Duplicate video"></video>
    {% elif path.is_video %}
    <img src="{{ url_for('static', filename='video_placeholder.svg') }}" alt="Duplicate video">
    {% else %}
    <img src="{{ url_for('media_by_path', mediaPath=path.path) }}" data-fallback="{{ url_for('placeholder') }}" alt="Duplicate photo">
    {% endif %}
</div>
