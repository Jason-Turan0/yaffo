<div class="settings-section" id="llm-section">
    <h2>{{ _("AI Generation") }}</h2>
    <p class="section-description">
        {{ _("Powers AI customization features. The API key for the selected model's provider is stored securely in the operating system's credential store.") }}
    </p>

    <div class="form-group">
        <label for="llm-model">{{ _("Model") }}</label>
        <select id="llm-model" name="model" class="searchable-select" data-search-disabled
                hx-post="{{ url_for('settings_llm_model') }}"
                hx-target="#llm-api-key" hx-swap="outerHTML">
            {% for p in llm.providers %}
            <optgroup label="{{ p.label }}">
                {% for m in llm.models if m.provider == p.id %}
                <option value="{{ m.id }}" {% if m.id == llm.model %}selected{% endif %}>{{ m.label }}</option>
                {% endfor %}
            </optgroup>
            {% endfor %}
        </select>
    </div>

    {% with provider = llm.selected_provider_status %}
    {% include 'settings/_llm_api_key.html' %}
    {% endwith %}
</div>
