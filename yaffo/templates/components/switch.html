{# A reusable on/off control. The caller owns its form or HTMX action. #}
{% macro switch(label, enabled, id=none, disabled=false, button_type='button', hx_post=none, hx_vals=none, hx_target=none, hx_swap=none) %}
<button type="{{ button_type }}" class="ui-switch" role="switch"
        aria-label="{{ label }}" aria-checked="{{ 'true' if enabled else 'false' }}"
        {% if id %}id="{{ id }}"{% endif %}
        {% if disabled %}disabled{% endif %}
        {% if hx_post %}hx-post="{{ hx_post }}"{% endif %}
        {% if hx_vals %}hx-vals="{{ hx_vals }}"{% endif %}
        {% if hx_target %}hx-target="{{ hx_target }}"{% endif %}
        {% if hx_swap %}hx-swap="{{ hx_swap }}"{% endif %}>
    <span class="ui-switch-track" aria-hidden="true"><span class="ui-switch-thumb"></span></span>
    <span class="ui-switch-state" aria-hidden="true">{{ _('On') if enabled else _('Off') }}</span>
</button>
{% endmacro %}
