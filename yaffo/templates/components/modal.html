{% macro render_modal(id, title, action_url, render_modal_form, action_text = "Save", action_class = "btn-primary", size_class = "") %}
    <div id="{{id}}" class="modal">
    <div class="modal-content {{size_class}}">
        <div class="modal-header">
            <h2 id="{{id}}Title">{{title}}</h2>
            <button type="button" class="modal-close" name="cancel" aria-label="Close">&times;</button>
        </div>
        <form id="{{id}}Form" method="POST" action="{{ action_url }}">
            <div class="modal-body thin-scrollbar">
                {{ render_modal_form() }}
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" name="cancel">Cancel</button>
                <button type="submit" class="btn {{action_class}}">{{action_text}}</button>
            </div>
        </form>
    </div>
    </div>
{% endmacro %}
