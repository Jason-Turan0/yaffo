{% macro collapsible_panel(id, title, is_open=False, done=None, value=None) %}
<details class="settings-section sync-step collapsible-panel" id="{{ id }}" {% if is_open %}open{% endif %}>
    <summary class="sync-step-head">
        <span class="sync-step-title">
            <h2>{{ title }}</h2>
            {% if done is not none %}
                <span class="chip {{ 'chip-success' if done else 'chip-warning' }}">{{ _('Done') if done else _('To do') }}</span>
            {% endif %}
        </span>
        {% if value %}<span class="sync-step-value">{{ value }}</span>{% endif %}
    </summary>
    <div class="sync-step-body">{{ caller() }}</div>
</details>
{% endmacro %}
