[pytest]
testpaths = tests
# The repo root, so tests can import the top-level `scripts` package. Without it a
# local run puts only each test file's directory on sys.path, and `tests/scripts/`
# (no __init__.py) shadows `scripts` as a namespace package. CI sets PYTHONPATH=.
# to the same effect.
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=yaffo
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-report=json:reports/python-coverage.json

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
