[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=yaffo
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-report=json:reports/python-coverage.json

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
