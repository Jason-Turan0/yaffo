name: Release

on:
  pull_request:
    branches: [master]
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to increment when version is not set."
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact X.Y.Z version to release. Overrides bump when set."
        required: false
        type: string
      publish_pypi:
        description: "Publish the Python artifacts to PyPI."
        required: true
        default: true
        type: boolean

# Version bumps and tags write to master, so merged releases must be serialized.
concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release-context:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.context.outputs.tag_name }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bump VERSION and create release tag
        id: context
        env:
          # Every merged PR is a patch release. A manual run can still select a
          # different increment or supply an exact version.
          BUMP_PART: ${{ inputs.bump || 'patch' }}
          VERSION_INPUT: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail

          if [ -n "$VERSION_INPUT" ]; then
            python packaging/bump_version.py --version "$VERSION_INPUT"
          else
            python packaging/bump_version.py --part "$BUMP_PART"
          fi

          version="$(cat VERSION)"
          tag_name="v$version"

          if git rev-parse -q --verify "refs/tags/$tag_name" >/dev/null; then
            echo "::error::Tag $tag_name already exists"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Release $tag_name"
          git tag "$tag_name"
          git push origin "HEAD:master"
          git push origin "$tag_name"

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-python:
    needs: release-context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # yaffo/_build_info.py is generated, not committed (.gitignore), and the bump
      # ran on a DIFFERENT runner — so this fresh checkout has no build info at all,
      # and the artifact would report "dev build" with no timestamp or sha. Stamp it
      # here, from the tagged VERSION, without bumping again.
      - name: Stamp build info
        run: python packaging/bump_version.py --stamp-only

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
