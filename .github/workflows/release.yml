  github-release:
    needs:
      - release-context
      - build-python
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-dist/

#      - uses: actions/download-artifact@v4
#        with:
#          name: macos-dmg
#          path: release-dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-context.outputs.tag_name }}
          name: Yaffo ${{ needs.release-context.outputs.version }}
          generate_release_notes: true
          files: release-dist/*

  publish-pypi:
    needs:
      - release-context
      - build-python
      - github-release
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
        inputs.publish_pypi
      }}
    # Trusted Publishing (OIDC) — no PyPI token stored in the repo.
    # The matching PyPI trusted publisher is already configured.
    environment:
      name: pypi
      url: https://pypi.org/project/yaffo/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
