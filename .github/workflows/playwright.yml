name: Playwright

on:
  pull_request:
    paths:
      - ".github/workflows/playwright.yml"
      - "pyproject.toml"
      - "yaffo/**"
      - "yaffo_ui_tests/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/playwright.yml"
      - "pyproject.toml"
      - "yaffo/**"
      - "yaffo_ui_tests/**"
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright UI tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          # Every suite except sharing, against the single-instance sandbox.
          - suite: core
            start: npm run isolatedEnvironment:start -- --port 5002
            ready_urls: http://127.0.0.1:5002
            test: npx playwright test --project=chromium
            peer_url: ""
          # The stateful sharing suite, against the two-instance sandbox
          # (A grants on 5002, B pulls on 5003; LAN pairing, no hub).
          - suite: sharing
            start: npm run isolatedEnvironment:start:sharing
            ready_urls: http://127.0.0.1:5002 http://127.0.0.1:5003
            test: npx playwright test --project=sharing
            peer_url: http://127.0.0.1:5003

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install -e '.[dev]'

      - name: Install UI test dependencies
        working-directory: yaffo_ui_tests
        run: npm ci

      - name: Install Playwright browser
        working-directory: yaffo_ui_tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: yaffo_ui_tests
        env:
          BASE_URL: http://127.0.0.1:5002
          PEER_URL: ${{ matrix.peer_url }}
        run: |
          mkdir -p reports
          ${{ matrix.start }} > reports/isolated-environment.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for url in ${{ matrix.ready_urls }}; do
            for attempt in {1..120}; do
              if curl -fsS "$url" >/dev/null; then
                break
              fi
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                echo "Isolated environment exited before becoming ready."
                cat reports/isolated-environment.log
                exit 1
              fi
              sleep 1
            done
            curl -fsS "$url" >/dev/null
          done

          ${{ matrix.test }}

      - name: Upload Playwright reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-reports-${{ matrix.suite }}
          path: |
            yaffo_ui_tests/reports/
          retention-days: 7