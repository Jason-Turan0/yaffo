name: Playwright

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/playwright.yml"
      - ".github/workflows/playwright-auto-heal.yml"
      - "pyproject.toml"
      - "yaffo/**"
      - "yaffo_ui_tests/**"
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Shared, symlink-free locations. The seed cache captures the (expensive)
# indexed data dirs; YAFFO_ASSET_DIR holds the models/binaries once for both
# profiles instead of duplicating them under each data dir.
env:
  SEED_CACHE_PATH: |
    /tmp/yaffo-seed
    /tmp/yaffo-assets
  YAFFO_SEED_CACHE_ROOT: /tmp/yaffo-seed
  YAFFO_ASSET_DIR: /tmp/yaffo-assets

jobs:
  validate-specs:
    name: Validate test specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json
      - name: Install UI test dependencies
        working-directory: yaffo_ui_tests
        run: npm ci
      - name: Validate spec YAML
        working-directory: yaffo_ui_tests
        run: npm run validate:specs

  list-specs:
    name: Enumerate spec files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      seed_key: ${{ steps.key.outputs.seed_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json
      - name: Install UI test dependencies
        working-directory: yaffo_ui_tests
        run: npm ci
      - name: Build spec matrix
        id: list
        working-directory: yaffo_ui_tests
        run: npx tsx scripts/list_specs.ts --github
      # Rebuild the seed only when the fixtures, seed script, or the indexing /
      # face / label / model code that shapes the seeded DB actually change.
      - name: Compute seed cache key
        id: key
        run: |
          echo "seed_key=seed-${{ runner.os }}-${{ hashFiles(
            'yaffo_ui_tests/test_data/bennett/**',
            'yaffo_ui_tests/test_data/obama/images/**',
            'yaffo_ui_tests/test_data/mp4/**',
            'yaffo_ui_tests/scripts/seed_database.py',
            'yaffo_ui_tests/lib/services/isolated_runner.ts',
            'yaffo/utils/index_photos.py',
            'yaffo/utils/index_video.py',
            'yaffo/utils/face_analysis.py',
            'yaffo/utils/image_classifier.py',
            'yaffo/download_assets.py',
            'yaffo/db/models.py',
            'pyproject.toml'
          ) }}-v1" >> "$GITHUB_OUTPUT"

  seed-cache:
    name: Build seed cache
    needs: list-specs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore seed cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SEED_CACHE_PATH }}
          key: ${{ needs.list-specs.outputs.seed_key }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json
      - name: Install Python dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install -e '.[dev]'
      - name: Install UI test dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: yaffo_ui_tests
        run: npm ci
      # Seeds both profiles into the canonical cache dirs, running the real
      # indexing/face/label pipeline. Saved by actions/cache at job end.
      - name: Build seed (real indexing + labeling)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: yaffo_ui_tests
        run: npx tsx lib/services/isolated_runner.ts --build-seed --peer

  playwright:
    name: ${{ matrix.id }}
    needs: [validate-specs, list-specs, seed-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level permissions replace the top-level block wholesale, so
    # contents: read has to be restated. checks: write lets test-reporter
    # publish the per-spec check run.
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list-specs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install -e '.[dev]'

      - name: Install UI test dependencies
        working-directory: yaffo_ui_tests
        run: npm ci

      - name: Install Playwright browser
        working-directory: yaffo_ui_tests
        run: npx playwright install --with-deps chromium

      - name: Install and enable bubblewrap
        # The specs are AI-generated, so they run confined (TEST_SANDBOX=bwrap):
        # read-only filesystem outside tmp and reports. ubuntu-latest is 24.04,
        # which ships kernel.apparmor_restrict_unprivileged_userns=1 and would
        # otherwise deny bwrap's uid_map write on every spawn.
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --die-with-parent true
          echo "bubblewrap can create user namespaces"

      - name: Restore seed cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SEED_CACHE_PATH }}
          key: ${{ needs.list-specs.outputs.seed_key }}
          fail-on-cache-miss: true

      - name: Run ${{ matrix.spec }}
        working-directory: yaffo_ui_tests
        env:
          SUITE: ${{ matrix.id }}
          BASE_URL: http://127.0.0.1:5002
          PEER_URL: ${{ matrix.peer == 'true' && 'http://127.0.0.1:5003' || '' }}
          # Run the specs inside bubblewrap. Pinned rather than auto-detected so
          # a runner image without a working bwrap fails loudly instead of
          # quietly running generated code unconfined.
          TEST_SANDBOX: bwrap
          # A CLI --reporter drops the config's reporter options, so name the
          # html and junit output paths explicitly (relative to yaffo_ui_tests).
          # Both land under reports/, which is writable inside the sandbox.
          PLAYWRIGHT_HTML_OUTPUT_DIR: reports/${{ matrix.id }}/html
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/${{ matrix.id }}/junit.xml
        run: |
          mkdir -p reports
          PEER_FLAG=""
          READY_URLS="http://127.0.0.1:5002"
          if [ "${{ matrix.peer }}" = "true" ]; then
            PEER_FLAG="--peer"
            READY_URLS="$READY_URLS http://127.0.0.1:5003"
          fi

          npx tsx lib/services/isolated_runner.ts --port 5002 --preseeded $PEER_FLAG \
            > reports/isolated-environment.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for url in $READY_URLS; do
            for attempt in {1..120}; do
              if curl -fsS "$url" >/dev/null; then
                break
              fi
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                echo "Isolated environment exited before becoming ready."
                cat reports/isolated-environment.log
                exit 1
              fi
              sleep 1
            done
            curl -fsS "$url" >/dev/null
          done

          # Via the runner, not `npx playwright test` directly: the runner is
          # what applies the OS sandbox and the env scrub. It derives the
          # project from the spec path the same way the matrix does, appends a
          # result table to the job summary, and the `github` reporter turns
          # each failure into an inline annotation on the PR diff — so a red
          # build is readable without downloading the report artifact.
          # --json-out is load-bearing: the auto-heal workflow discovers which
          # specs failed by scanning this artifact for test-results.json, and a
          # CLI --reporter overrides the config's json outputFile.
          npx tsx lib/services/run_playwright_tests.ts \
            --reporter "json,html,list,github,junit" \
            --title "${{ matrix.id }}" \
            --json-out "reports/${{ matrix.id }}/results/test-results.json" \
            "${{ matrix.spec }}"

      # Publishes a browsable per-test check run (the CodeBuild "test report"
      # equivalent). Pinned to the commit behind v3.0.0 rather than a mutable
      # tag: this job restores the seed cache and runs generated code, so a
      # retagged third-party action must not silently change under it.
      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        # A fork PR gets a read-only token and cannot create check runs; the
        # job summary and artifact still cover that case, so never fail here.
        continue-on-error: true
        with:
          name: Tests (${{ matrix.id }})
          path: yaffo_ui_tests/reports/${{ matrix.id }}/junit.xml
          reporter: java-junit
          # The run step already failed the job on a red test; this step exists
          # to publish, not to re-fail. fail-on-empty likewise: a crash before
          # any test ran is already reported by the step that crashed.
          fail-on-error: false
          fail-on-empty: false

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-reports-${{ matrix.id }}
          path: yaffo_ui_tests/reports/
          retention-days: 7
