name: Playwright

on:
  pull_request:
    paths:
      - ".github/workflows/playwright.yml"
      - "pyproject.toml"
      - "yaffo/**"
      - "yaffo_ui_tests/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/playwright.yml"
      - "pyproject.toml"
      - "yaffo/**"
      - "yaffo_ui_tests/**"
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install -e '.[dev]'

      - name: Install UI test dependencies
        working-directory: yaffo_ui_tests
        run: npm ci

      - name: Install Playwright browser
        working-directory: yaffo_ui_tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: yaffo_ui_tests
        env:
          BASE_URL: http://127.0.0.1:5002
        run: |
          mkdir -p reports
          npm run isolatedEnvironment:start -- --port 5002 > reports/isolated-environment.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl -fsS "$BASE_URL" >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Isolated environment exited before becoming ready."
              cat reports/isolated-environment.log
              exit 1
            fi
            sleep 1
          done

          curl -fsS "$BASE_URL" >/dev/null
          npx playwright test

      - name: Upload Playwright reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-reports
          path: |
            yaffo_ui_tests/reports/
          retention-days: 7
