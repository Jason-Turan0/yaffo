name: Playwright Auto-Heal

on:
  workflow_run:
    workflows: ["Playwright"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Playwright workflow run id to heal"
        required: true
        type: string
      head_branch:
        description: "Base branch for the healing PR"
        required: true
        type: string
        default: "master"
      head_sha:
        description: "Commit SHA from the Playwright run"
        required: true
        type: string
      model:
        description: "Model alias for the healer (overrides the MODEL_ALIAS repo variable)"
        required: false
        type: string

concurrency:
  group: playwright-auto-heal-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

env:
  SEED_CACHE_PATH: |
    /tmp/yaffo-seed
    /tmp/yaffo-assets
  YAFFO_SEED_CACHE_ROOT: /tmp/yaffo-seed
  YAFFO_ASSET_DIR: /tmp/yaffo-assets
  RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
  HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
  BASE_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.head_branch }}
  # Manual-run input wins; otherwise the MODEL_ALIAS repo/org variable; else default.
  MODEL_ALIAS: ${{ inputs.model || vars.MODEL_ALIAS || 'claude-sonnet-5' }}

jobs:
  discover:
    name: Discover failed specs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_failures: ${{ steps.matrix.outputs.has_failures }}
      seed_key: ${{ steps.key.outputs.seed_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json
      - name: Install UI test dependencies
        working-directory: yaffo_ui_tests
        run: npm ci
      - name: Download per-spec Playwright reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-reports-*
          path: yaffo_ui_tests/reports/from-playwright
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build failed-feature matrix
        id: matrix
        working-directory: yaffo_ui_tests
        run: npx tsx scripts/failed_spec_matrix.ts reports/from-playwright --github
      # Same key playwright.yml uses, so we restore the seed built by that run.
      - name: Compute seed cache key
        id: key
        run: |
          echo "seed_key=seed-${{ runner.os }}-${{ hashFiles(
            'yaffo_ui_tests/test_data/bennett/**',
            'yaffo_ui_tests/test_data/obama/images/**',
            'yaffo_ui_tests/test_data/mp4/**',
            'yaffo_ui_tests/scripts/seed_database.py',
            'yaffo_ui_tests/lib/services/isolated_runner.ts',
            'yaffo/utils/index_photos.py',
            'yaffo/utils/index_video.py',
            'yaffo/utils/face_analysis.py',
            'yaffo/utils/image_classifier.py',
            'yaffo/download_assets.py',
            'yaffo/db/models.py',
            'pyproject.toml'
          ) }}-v1" >> "$GITHUB_OUTPUT"

  heal:
    name: Heal ${{ matrix.id }}
    needs: discover
    if: ${{ needs.discover.outputs.has_failures == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          token: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install -e '.[dev]'
      - name: Install UI test dependencies
        working-directory: yaffo_ui_tests
        run: npm ci
      - name: Install Playwright browser
        working-directory: yaffo_ui_tests
        run: npx playwright install --with-deps chromium

      # Best-effort: reuse the seed the Playwright run built. On a miss the
      # healer falls back to seeding fresh (slower, but still correct).
      - name: Restore seed cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SEED_CACHE_PATH }}
          key: ${{ needs.discover.outputs.seed_key }}

      - name: Auto-heal ${{ matrix.spec }}
        working-directory: yaffo_ui_tests
        env:
          # The healer picks the provider from the MODEL_ALIAS alias; only the
          # matching key is needed — the rest are empty and harmless.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PRESEEDED_FLAG: ${{ steps.cache.outputs.cache-hit == 'true' && '--preseeded' || '' }}
          MODEL_ALIAS: ${{ env.MODEL_ALIAS }}
          # Optional repo/org variable; empty falls back to the healer's default (50).
          HEAL_MAX_ITERATIONS: ${{ vars.HEAL_MAX_ITERATIONS }}
        run: |
          # One healer run per YAML spec: it re-runs every generated test file
          # for the feature against a shared environment and heals the failures
          # serially, writing one assessment JSON per test file.
          mkdir -p reports/assessments
          npx tsx lib/test_generator/heal_test.ts "${{ matrix.spec }}" $PRESEEDED_FLAG \
            --model "$MODEL_ALIAS" --assessment-out reports/assessments || true

      - name: Publish assessments to job summary
        if: ${{ always() }}
        working-directory: yaffo_ui_tests
        run: |
          shopt -s nullglob
          files=(reports/assessments/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "## Auto-heal: ${{ matrix.dir }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No assessments produced (the healer did not run to completion)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for F in "${files[@]}"; do
            spec=$(jq -r '.spec' "$F")
            success=$(jq -r '.success' "$F")
            classification=$(jq -r '.classification' "$F")
            iterations=$(jq -r '.iterations' "$F")
            error=$(jq -r '.error // ""' "$F")
            if [ "$success" = "true" ]; then outcome="✅ healed"; else outcome="❌ not healed"; fi
            {
              echo "## Auto-heal: $spec"
              echo ""
              echo "- **Outcome:** $outcome"
              echo "- **Classification:** \`$classification\`"
              echo "- **Iterations:** $iterations"
              [ -n "$error" ] && echo "- **Assessment:** $error"
              echo "- **Logs:** download the \`heal-logs-${{ matrix.id }}\` artifact"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload assessments
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: heal-assessment-${{ matrix.id }}
          path: yaffo_ui_tests/reports/assessments/
          if-no-files-found: ignore
          retention-days: 90

      # One job owns each feature directory, so a feature's spec fixes, memory
      # updates, and sibling edits land in a single patch and the collector can
      # apply the per-feature patches together without conflicts.
      - name: Capture healed diff
        run: |
          mkdir -p patches
          # Intent-to-add so files the healer created (new memories, new specs)
          # appear in the diff — plain `git diff` skips untracked files.
          git add --intent-to-add yaffo_ui_tests/generated_tests
          git diff -- yaffo_ui_tests/generated_tests > "patches/${{ matrix.id }}.patch"
          if [ -s "patches/${{ matrix.id }}.patch" ]; then
            echo "Captured changes for ${{ matrix.id }}"
          else
            echo "No changes produced for ${{ matrix.id }}"
          fi

      - name: Upload healed patch
        uses: actions/upload-artifact@v4
        with:
          name: heal-patch-${{ matrix.id }}
          path: patches/${{ matrix.id }}.patch
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload auto-heal logs
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: heal-logs-${{ matrix.id }}
          path: yaffo_ui_tests/reports/api_logs/
          if-no-files-found: ignore
          retention-days: 90

  open-pr:
    name: Open healing PR
    needs: [discover, heal]
    if: ${{ always() && needs.discover.outputs.has_failures == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          token: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Download healed patches
        uses: actions/download-artifact@v4
        with:
          pattern: heal-patch-*
          path: patches
          merge-multiple: true
      - name: Download assessments
        uses: actions/download-artifact@v4
        with:
          pattern: heal-assessment-*
          path: assessments
      # Artifacts expire (90-day max); a rolling prerelease keeps the assessments
      # permanently, one asset per run, for later reference.
      - name: Archive assessments to release
        env:
          GH_TOKEN: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob globstar
          files=(assessments/**/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No assessments to archive."
            exit 0
          fi
          out="auto-heal-${RUN_ID}.json"
          jq -s --arg run "$RUN_ID" --arg sha "$HEAD_SHA" --arg branch "$BASE_BRANCH" \
            '{run_id: $run, head_sha: $sha, base_branch: $branch, generated_at: now | todate, assessments: .}' \
            "${files[@]}" > "$out"

          TAG="auto-heal-history"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --prerelease --latest=false \
                 --title "Auto-heal assessment archive" \
                 --notes "Durable archive of auto-heal assessments. Each asset is one Playwright run's assessments (artifacts themselves expire after 90 days)."
          gh release upload "$TAG" "$out" --clobber
          echo "Archived ${out} to release ${TAG}"
      - name: File regression issues
        env:
          GH_TOKEN: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob globstar
          # An application_regression means the test is correct and the app has a
          # real bug — no patch to PR, so surface it as an issue instead.
          for f in assessments/**/*.json; do
            [ "$(jq -r '.classification' "$f")" = "application_regression" ] || continue
            spec=$(jq -r '.spec' "$f")
            reason=$(jq -r '.error // "See auto-heal logs."' "$f")
            title="Auto-heal: application regression in ${spec}"
            # Idempotent: skip if an open issue with this title already exists.
            if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')" ]; then
              echo "Issue already open for ${spec}"
              continue
            fi
            body=$(printf '%s\n\n%s\n\n%s\n' \
              "The auto-healer classified \`${spec}\` as an application regression (the test looks correct; the app has a real bug)." \
              "**Assessment:** ${reason}" \
              "From Playwright run ${RUN_ID}. See the \`heal-logs-*\` artifacts for the full triage.")
            gh issue create --title "$title" --body "$body" --label "auto-heal,bug" \
              || gh issue create --title "$title" --body "$body" \
              || echo "::warning::Could not create issue for ${spec}"
          done
      - name: Apply patches and open PR
        env:
          GH_TOKEN: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob globstar
          applied=0
          for patch in patches/*.patch; do
            [ -s "$patch" ] || continue
            if git apply "$patch"; then
              echo "Applied $patch"
              applied=$((applied + 1))
            else
              echo "::warning::Failed to apply $patch"
            fi
          done

          if [ "$applied" -eq 0 ] || [ -z "$(git status --porcelain -- yaffo_ui_tests/generated_tests)" ]; then
            echo "No healed spec changes to propose."
            exit 0
          fi

          # Build the PR body from the per-spec assessments.
          BODY_FILE=$(mktemp)
          {
            echo "Auto-generated fixes for failed Playwright spec files from workflow run ${RUN_ID}."
            echo ""
            echo "| Spec | Outcome | Classification | Iterations |"
            echo "| --- | --- | --- | --- |"
            for f in assessments/**/*.json; do
              spec=$(jq -r '.spec' "$f")
              iterations=$(jq -r '.iterations' "$f")
              classification=$(jq -r '.classification' "$f")
              if [ "$(jq -r '.success' "$f")" = "true" ]; then outcome="✅ healed"; else outcome="❌ not healed"; fi
              echo "| \`$spec\` | $outcome | \`$classification\` | $iterations |"
            done
            echo ""
            echo "_Per-spec triage logs are in the \`heal-logs-*\` artifacts of run ${RUN_ID}._"
          } > "$BODY_FILE"

          BRANCH="auto-heal/playwright-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add yaffo_ui_tests/generated_tests
          git commit -m "Auto-heal Playwright tests (${applied} spec file(s))"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "Auto-heal Playwright tests" \
            --body-file "$BODY_FILE" \
            || gh pr edit "$BRANCH" \
              --base "$BASE_BRANCH" \
              --title "Auto-heal Playwright tests" \
              --body-file "$BODY_FILE"
