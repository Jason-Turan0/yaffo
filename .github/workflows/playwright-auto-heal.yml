name: Playwright Auto-Heal

on:
  workflow_run:
    workflows: ["Playwright"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Playwright workflow run id to heal"
        required: true
        type: string
      head_branch:
        description: "Base branch for the healing PR"
        required: true
        type: string
        default: "master"
      head_sha:
        description: "Commit SHA from the Playwright run"
        required: true
        type: string
      model:
        description: "Model alias for the healer (overrides the MODEL_ALIAS repo variable)"
        required: false
        type: string

concurrency:
  group: playwright-auto-heal-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

env:
  SEED_CACHE_PATH: |
    /tmp/yaffo-seed
    /tmp/yaffo-assets
  YAFFO_SEED_CACHE_ROOT: /tmp/yaffo-seed
  YAFFO_ASSET_DIR: /tmp/yaffo-assets
  RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
  HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
  BASE_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.head_branch }}
  # Manual-run input wins; otherwise the MODEL_ALIAS repo/org variable; else default.
  MODEL_ALIAS: ${{ inputs.model || vars.MODEL_ALIAS || 'claude-sonnet-5' }}

jobs:
  discover:
    name: Discover failed specs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_failures: ${{ steps.matrix.outputs.has_failures }}
      seed_key: ${{ steps.key.outputs.seed_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json
      - name: Install UI test dependencies
        working-directory: yaffo_ui_tests
        run: npm ci
      - name: Download per-spec Playwright reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-reports-*
          path: yaffo_ui_tests/reports/from-playwright
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build failed-feature matrix
        id: matrix
        working-directory: yaffo_ui_tests
        run: npx tsx scripts/failed_spec_matrix.ts reports/from-playwright --github
      # Same key playwright.yml uses, so we restore the seed built by that run.
      - name: Compute seed cache key
        id: key
        run: |
          echo "seed_key=seed-${{ runner.os }}-${{ hashFiles(
            'yaffo_ui_tests/test_data/bennett/**',
            'yaffo_ui_tests/test_data/obama/images/**',
            'yaffo_ui_tests/test_data/mp4/**',
            'yaffo_ui_tests/scripts/seed_database.py',
            'yaffo_ui_tests/lib/services/isolated_runner.ts',
            'yaffo/utils/index_photos.py',
            'yaffo/utils/index_video.py',
            'yaffo/utils/face_analysis.py',
            'yaffo/utils/image_classifier.py',
            'yaffo/download_assets.py',
            'yaffo/db/models.py',
            'pyproject.toml'
          ) }}-v1" >> "$GITHUB_OUTPUT"

  heal:
    name: Heal ${{ matrix.id }}
    needs: discover
    if: ${{ needs.discover.outputs.has_failures == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          token: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          # The heal job never pushes; don't leave the token in .git/config
          # where generated test code could read it.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json

      - name: Install system libraries
        # bubblewrap sandboxes the generated-test execution (TEST_SANDBOX=bwrap).
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 bubblewrap

      - name: Enable unprivileged user namespaces for bubblewrap
        # ubuntu-latest is 24.04, which ships
        # kernel.apparmor_restrict_unprivileged_userns=1. That denies bwrap's
        # uid_map write ("bwrap: setting up uid map: Permission denied") on every
        # spawn, so the heal step would fail to run a single test.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Prove the sandbox actually starts here rather than 20 minutes into a heal.
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --die-with-parent true
          echo "bubblewrap can create user namespaces"

      - name: Install Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install -e '.[dev]'
      - name: Install UI test dependencies
        working-directory: yaffo_ui_tests
        run: npm ci
      - name: Install Playwright browser
        working-directory: yaffo_ui_tests
        run: npx playwright install --with-deps chromium

      # Best-effort: reuse the seed the Playwright run built. On a miss the
      # healer falls back to seeding fresh (slower, but still correct).
      - name: Restore seed cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SEED_CACHE_PATH }}
          key: ${{ needs.discover.outputs.seed_key }}

      - name: Auto-heal ${{ matrix.spec }}
        working-directory: yaffo_ui_tests
        env:
          # The healer picks the provider from the MODEL_ALIAS alias; only the
          # matching key is needed — the rest are empty and harmless.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PRESEEDED_FLAG: ${{ steps.cache.outputs.cache-hit == 'true' && '--preseeded' || '' }}
          MODEL_ALIAS: ${{ env.MODEL_ALIAS }}
          # Optional repo/org variable; empty falls back to the healer's default (50).
          HEAL_MAX_ITERATIONS: ${{ vars.HEAL_MAX_ITERATIONS }}
          # The runner auto-detects a sandbox per platform (bwrap on Linux,
          # sandbox-exec on macOS); pinning it here makes CI fail loudly if
          # bubblewrap is missing rather than run generated code unwrapped.
          TEST_SANDBOX: bwrap
        run: |
          # One healer run per YAML spec: it re-runs every generated test file
          # for the feature against a shared environment and heals the failures
          # serially, writing one assessment JSON per test file.
          mkdir -p reports/assessments
          npx tsx lib/test_generator/heal_test.ts "${{ matrix.spec }}" $PRESEEDED_FLAG \
            --model "$MODEL_ALIAS" --assessment-out reports/assessments || true

      - name: Publish assessments to job summary
        if: ${{ always() }}
        working-directory: yaffo_ui_tests
        run: |
          shopt -s nullglob
          files=(reports/assessments/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "## Auto-heal: ${{ matrix.dir }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No assessments produced (the healer did not run to completion)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for F in "${files[@]}"; do
            spec=$(jq -r '.spec' "$F")
            success=$(jq -r '.success' "$F")
            classification=$(jq -r '.classification' "$F")
            iterations=$(jq -r '.iterations' "$F")
            error=$(jq -r '.error // ""' "$F")
            # Spend for this spec. cost_usd is an estimate from MODEL_PRICING,
            # so report the token counts that produced it alongside.
            api_calls=$(jq -r '.api_calls // ""' "$F")
            cost_raw=$(jq -r '.cost_usd // ""' "$F")
            cost=""
            [ -n "$cost_raw" ] && cost=$(printf '$%.4f' "$cost_raw")
            # The four buckets are disjoint and sum to totalTokens: "uncached in"
            # excludes cache reads/writes, so this does not double-count a
            # cached prompt the way the provider dashboards would flag.
            tokens=$(jq -r 'if .tokens == null then "" else
              "\(.tokens.totalTokens) total — \(.tokens.inputTokens) uncached in / \(.tokens.outputTokens) out / \(.tokens.cacheReadTokens) cache read / \(.tokens.cacheWriteTokens) cache write"
              end' "$F")
            # The triage the model produced before healing (assessment field
            # triage_analysis, mirrored in generated_tests/*/*.triage_analysis.json).
            reasoning=$(jq -r '.triage_analysis.reasoning // ""' "$F")
            suggested=$(jq -r '.triage_analysis.suggestedAction // ""' "$F")
            affected=$(jq -r '(.triage_analysis.affectedTests // []) | map("- `" + . + "`") | join("\n")' "$F")
            if [ "$success" = "true" ]; then outcome="✅ healed"; else outcome="❌ not healed"; fi
            {
              echo "## Auto-heal: $spec"
              echo ""
              echo "- **Outcome:** $outcome"
              echo "- **Classification:** \`$classification\`"
              echo "- **Iterations:** $iterations"
              [ -n "$cost" ] && echo "- **Estimated cost:** $cost over ${api_calls:-?} API call(s)"
              [ -n "$tokens" ] && echo "- **Tokens:** $tokens"
              [ -n "$error" ] && echo "- **Assessment:** $error"
              echo "- **Logs:** download the \`heal-logs-${{ matrix.id }}\` artifact"
              if [ -n "$reasoning" ] || [ -n "$suggested" ] || [ -n "$affected" ]; then
                echo ""
                echo "<details><summary>Triage analysis</summary>"
                echo ""
                [ -n "$reasoning" ] && { echo "**Reasoning:** $reasoning"; echo ""; }
                [ -n "$affected" ] && { echo "**Affected tests:**"; echo ""; echo "$affected"; echo ""; }
                [ -n "$suggested" ] && { echo "**Suggested action:** $suggested"; echo ""; }
                echo "</details>"
                # A raw-HTML block runs to the next blank line; without this the
                # following spec's "## Auto-heal" heading is swallowed into it.
                echo ""
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done
          # What this job spent in total (a feature can hold several spec files).
          jq -s -r '{
              cost: (map(.cost_usd // 0) | add),
              calls: (map(.api_calls // 0) | add),
              tokens: (map(.tokens.totalTokens // 0) | add)
            }
            | "\n**Job total:** $\(.cost * 10000 | round / 10000) over \(.calls) API call(s), \(.tokens) tokens\n"' \
            "${files[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assessments
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: heal-assessment-${{ matrix.id }}
          path: yaffo_ui_tests/reports/assessments/
          if-no-files-found: ignore
          retention-days: 90

      # One job owns each feature directory, so a feature's spec fixes, memory
      # updates, and sibling edits land in a single patch and the collector can
      # apply the per-feature patches together without conflicts.
      - name: Capture healed diff
        run: |
          mkdir -p patches
          # Intent-to-add so files the healer created (new memories, new specs)
          # appear in the diff — plain `git diff` skips untracked files.
          git add --intent-to-add yaffo_ui_tests/generated_tests
          git diff -- yaffo_ui_tests/generated_tests > "patches/${{ matrix.id }}.patch"
          if [ -s "patches/${{ matrix.id }}.patch" ]; then
            echo "Captured changes for ${{ matrix.id }}"
          else
            echo "No changes produced for ${{ matrix.id }}"
          fi

      - name: Upload healed patch
        uses: actions/upload-artifact@v4
        with:
          name: heal-patch-${{ matrix.id }}
          path: patches/${{ matrix.id }}.patch
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload auto-heal logs
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: heal-logs-${{ matrix.id }}
          path: yaffo_ui_tests/reports/api_logs/
          if-no-files-found: ignore
          retention-days: 90

  open-pr:
    name: Open healing PR
    needs: [discover, heal]
    if: ${{ always() && needs.discover.outputs.has_failures == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          token: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Download healed patches
        uses: actions/download-artifact@v4
        with:
          pattern: heal-patch-*
          path: patches
          merge-multiple: true
      - name: Download assessments
        uses: actions/download-artifact@v4
        with:
          pattern: heal-assessment-*
          path: assessments
      # Artifacts expire (90-day max); a rolling prerelease keeps the assessments
      # permanently, one asset per run, for later reference.
      - name: Archive assessments to release
        env:
          GH_TOKEN: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob globstar
          files=(assessments/**/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No assessments to archive."
            exit 0
          fi
          out="auto-heal-${RUN_ID}.json"
          jq -s --arg run "$RUN_ID" --arg sha "$HEAD_SHA" --arg branch "$BASE_BRANCH" \
            '{run_id: $run, head_sha: $sha, base_branch: $branch, generated_at: now | todate, assessments: .}' \
            "${files[@]}" > "$out"

          TAG="auto-heal-history"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --prerelease --latest=false \
                 --title "Auto-heal assessment archive" \
                 --notes "Durable archive of auto-heal assessments. Each asset is one Playwright run's assessments (artifacts themselves expire after 90 days)."
          gh release upload "$TAG" "$out" --clobber
          echo "Archived ${out} to release ${TAG}"
      - name: File regression issues
        env:
          GH_TOKEN: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob globstar
          # An application_regression means the test is correct and the app has a
          # real bug — no patch to PR, so surface it as an issue instead.
          for f in assessments/**/*.json; do
            [ "$(jq -r '.classification' "$f")" = "application_regression" ] || continue
            spec=$(jq -r '.spec' "$f")
            reason=$(jq -r '.error // "See auto-heal logs."' "$f")
            # Triage detail from <feature>.triage_analysis.json, inlined into the
            # assessment — the reasoning and repro surface are what a human needs
            # to act on the bug, so put them in the issue rather than an artifact.
            reasoning=$(jq -r '.triage_analysis.reasoning // ""' "$f")
            suggested=$(jq -r '.triage_analysis.suggestedAction // ""' "$f")
            affected=$(jq -r '(.triage_analysis.affectedTests // []) | map("- `" + . + "`") | join("\n")' "$f")
            title="Auto-heal: application regression in ${spec}"
            # Idempotent: skip if an open issue with this title already exists.
            if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')" ]; then
              echo "Issue already open for ${spec}"
              continue
            fi
            body=$(printf '%s\n\n%s\n' \
              "The auto-healer classified \`${spec}\` as an application regression (the test looks correct; the app has a real bug)." \
              "**Assessment:** ${reason}")
            [ -n "$reasoning" ] && body=$(printf '%s\n\n### Triage analysis\n\n%s\n' "$body" "$reasoning")
            [ -n "$affected" ] && body=$(printf '%s\n\n**Affected tests:**\n\n%s\n' "$body" "$affected")
            [ -n "$suggested" ] && body=$(printf '%s\n\n**Suggested action:** %s\n' "$body" "$suggested")
            body=$(printf '%s\n\n%s\n' "$body" \
              "From Playwright run ${RUN_ID}. See the \`heal-logs-*\` artifacts for the full triage.")
            gh issue create --title "$title" --body "$body" --label "auto-heal,bug" \
              || gh issue create --title "$title" --body "$body" \
              || echo "::warning::Could not create issue for ${spec}"
          done
      - name: Apply patches and open PR
        env:
          GH_TOKEN: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob globstar
          applied=0
          for patch in patches/*.patch; do
            [ -s "$patch" ] || continue
            if git apply "$patch"; then
              echo "Applied $patch"
              applied=$((applied + 1))
            else
              echo "::warning::Failed to apply $patch"
            fi
          done

          if [ "$applied" -eq 0 ] || [ -z "$(git status --porcelain -- yaffo_ui_tests/generated_tests)" ]; then
            echo "No healed spec changes to propose."
            exit 0
          fi

          # Build the PR body from the per-spec assessments. Collected once:
          # `jq -s` with no file arguments would block on stdin, so every use
          # below is guarded on this array being non-empty.
          assessment_files=(assessments/**/*.json)
          BODY_FILE=$(mktemp)
          {
            echo "Auto-generated fixes for failed Playwright spec files from workflow run ${RUN_ID}."
            echo ""
            echo "| Spec | Outcome | Classification | Iterations | Est. cost | Tokens | API calls |"
            echo "| --- | --- | --- | --- | ---: | ---: | ---: |"
            for f in "${assessment_files[@]}"; do
              spec=$(jq -r '.spec' "$f")
              iterations=$(jq -r '.iterations' "$f")
              classification=$(jq -r '.classification' "$f")
              cost=$(jq -r 'if .cost_usd == null then "—" else "$\(.cost_usd * 10000 | round / 10000)" end' "$f")
              tokens=$(jq -r '.tokens.totalTokens // "—"' "$f")
              calls=$(jq -r '.api_calls // "—"' "$f")
              if [ "$(jq -r '.success' "$f")" = "true" ]; then outcome="✅ healed"; else outcome="❌ not healed"; fi
              echo "| \`$spec\` | $outcome | \`$classification\` | $iterations | $cost | $tokens | $calls |"
            done
            # Run-level spend, summed over every feature job's assessments.
            if [ ${#assessment_files[@]} -gt 0 ]; then
              jq -s -r '{
                  cost: ((map(.cost_usd // 0) | add) // 0),
                  calls: ((map(.api_calls // 0) | add) // 0),
                  input: ((map(.tokens.inputTokens // 0) | add) // 0),
                  output: ((map(.tokens.outputTokens // 0) | add) // 0),
                  cacheRead: ((map(.tokens.cacheReadTokens // 0) | add) // 0),
                  cacheWrite: ((map(.tokens.cacheWriteTokens // 0) | add) // 0),
                  tokens: ((map(.tokens.totalTokens // 0) | add) // 0)
                }
                | "| **Total** | | | | **$\(.cost * 10000 | round / 10000)** | **\(.tokens)** | **\(.calls)** |",
                  "",
                  "_Token split: \(.input) uncached in / \(.output) out / \(.cacheRead) cache read / \(.cacheWrite) cache write — disjoint buckets that sum to the total. Cost is estimated from the model price table at run time._"' \
                "${assessment_files[@]}"
            fi
            echo ""
            # Why each spec was changed: the triage_analysis the healer wrote
            # before editing. Collapsed per spec so the table stays readable.
            echo "## Triage analysis"
            echo ""
            any_triage=0
            for f in "${assessment_files[@]}"; do
              [ "$(jq -r 'has("triage_analysis") and .triage_analysis != null' "$f")" = "true" ] || continue
              any_triage=1
              spec=$(jq -r '.spec' "$f")
              classification=$(jq -r '.triage_analysis.classification // .classification' "$f")
              reasoning=$(jq -r '.triage_analysis.reasoning // ""' "$f")
              suggested=$(jq -r '.triage_analysis.suggestedAction // ""' "$f")
              affected=$(jq -r '(.triage_analysis.affectedTests // []) | map("- `" + . + "`") | join("\n")' "$f")
              echo "<details><summary><code>${spec}</code> — <code>${classification}</code></summary>"
              echo ""
              [ -n "$reasoning" ] && { echo "**Reasoning:** $reasoning"; echo ""; }
              [ -n "$affected" ] && { echo "**Affected tests:**"; echo ""; echo "$affected"; echo ""; }
              [ -n "$suggested" ] && { echo "**Suggested action:** $suggested"; echo ""; }
              echo "</details>"
              echo ""
            done
            [ "$any_triage" -eq 0 ] && echo "_No triage analysis recorded (every spec was already passing)._"
            echo ""
            echo "_Per-spec triage logs are in the \`heal-logs-*\` artifacts of run ${RUN_ID}._"
          } > "$BODY_FILE"

          BRANCH="auto-heal/playwright-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add yaffo_ui_tests/generated_tests
          git commit -m "Auto-heal Playwright tests (${applied} spec file(s))"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "Auto-heal Playwright tests" \
            --body-file "$BODY_FILE" \
            || gh pr edit "$BRANCH" \
              --base "$BASE_BRANCH" \
              --title "Auto-heal Playwright tests" \
              --body-file "$BODY_FILE"
