name: Playwright Auto-Heal

on:
  workflow_run:
    workflows: ["Playwright"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Playwright workflow run id to heal"
        required: true
        type: string
      head_branch:
        description: "Base branch for the healing PR"
        required: true
        type: string
        default: "master"
      head_sha:
        description: "Commit SHA from the Playwright run"
        required: true
        type: string

concurrency:
  group: playwright-auto-heal-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  heal:
    name: Heal failed Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
          token: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install -e '.[dev]'

      - name: Install UI test dependencies
        working-directory: yaffo_ui_tests
        run: npm ci

      - name: Install Playwright browser
        working-directory: yaffo_ui_tests
        run: npx playwright install --with-deps chromium

      - name: Download Playwright report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-reports
          path: yaffo_ui_tests/reports/from-playwright
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-heal failed Playwright specs
        working-directory: yaffo_ui_tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run test:heal:repo -- --report-dir reports/from-playwright --port 5002

      - name: Upload auto-heal logs
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-auto-heal-logs
          path: yaffo_ui_tests/reports/api_logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          if [ -z "$(git status --porcelain -- yaffo_ui_tests/generated_tests)" ]; then
            echo "No generated test changes to propose."
            exit 0
          fi

          BRANCH="auto-heal/playwright-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add yaffo_ui_tests/generated_tests
          git commit -m "Auto-heal Playwright tests"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "Auto-heal Playwright tests" \
            --body "Auto-generated fixes for failed Playwright tests from workflow run ${RUN_ID}." \
            || gh pr edit "$BRANCH" \
              --base "$BASE_BRANCH" \
              --title "Auto-heal Playwright tests" \
              --body "Auto-generated fixes for failed Playwright tests from workflow run ${RUN_ID}."
