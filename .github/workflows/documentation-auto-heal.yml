name: Documentation Auto-Heal

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/documentation-auto-heal.yml"
      - "docs/guide/**"
      - "messages.pot"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "yaffo/**"
      - "yaffo_ui_tests/docker/docs-capture/**"
      - "yaffo_ui_tests/lib/user_doc_automation/**"
      - "yaffo_ui_tests/lib/services/isolated_runner.ts"
      - "yaffo_ui_tests/package-lock.json"
      - "yaffo_ui_tests/package.json"
      - "yaffo_ui_tests/scripts/seed_database.py"
      - "yaffo_ui_tests/test_data/bennett/**"
      - "yaffo_ui_tests/test_data/mp4/**"
      - "yaffo_ui_tests/user_doc_automation/**"
  workflow_dispatch:
    inputs:
      head_branch:
        description: "Feature branch that the generated documentation PR targets"
        required: true
        type: string
      head_sha:
        description: "Exact feature-branch commit to document"
        required: true
        type: string
      model:
        description: "Model alias (overrides the MODEL_ALIAS repository variable)"
        required: false
        type: string

concurrency:
  group: documentation-auto-heal-${{ github.event.pull_request.head.ref || inputs.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref || inputs.head_branch }}
  RUN_ID: ${{ github.run_id }}
  MODEL_ALIAS: ${{ inputs.model || vars.MODEL_ALIAS || 'claude-sonnet-5' }}
  DOCS_BASE_URL: http://127.0.0.1:5002
  YAFFO_DOCS_DATA_DIR: /tmp/yaffo-docs
  YAFFO_ASSET_DIR: /tmp/yaffo-assets
  DOCS_SEED_CACHE_PATH: |
    /tmp/yaffo-docs
    /tmp/yaffo-assets

jobs:
  discover:
    name: Discover documentation pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.pages.outputs.matrix }}
      has_pages: ${{ steps.pages.outputs.has_pages }}
      seed_key: ${{ steps.seed-key.outputs.seed_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json
      - name: Install UI test dependencies
        working-directory: yaffo_ui_tests
        run: npm ci
      - name: Build eligible page matrix
        id: pages
        working-directory: yaffo_ui_tests
        run: npm run docs:heal:repo -- --github
      - name: Compute documentation fixture cache key
        id: seed-key
        run: |
          echo "seed_key=docs-seed-${{ runner.os }}-${{ hashFiles('yaffo_ui_tests/test_data/bennett/**', 'yaffo_ui_tests/test_data/mp4/**', 'yaffo_ui_tests/scripts/seed_database.py', 'yaffo_ui_tests/lib/services/isolated_runner.ts', 'yaffo/utils/index_photos.py', 'yaffo/utils/index_video.py', 'yaffo/utils/face_analysis.py', 'yaffo/utils/image_classifier.py', 'yaffo/download_assets.py', 'yaffo/db/models.py', 'pyproject.toml') }}-v1" >> "$GITHUB_OUTPUT"

  seed-cache:
    name: Build documentation fixture
    needs: discover
    if: ${{ needs.discover.outputs.has_pages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Restore documentation fixture
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DOCS_SEED_CACHE_PATH }}
          key: ${{ needs.discover.outputs.seed_key }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json
      - name: Install Python dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install -e '.[dev,docs]'
      - name: Install UI test dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: yaffo_ui_tests
        run: npm ci
      - name: Build documentation fixture
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: yaffo_ui_tests
        run: npm run docs:fixture:build

  heal:
    name: Heal ${{ matrix.page }}
    needs: [discover, seed-cache]
    if: >-
      ${{
        needs.discover.outputs.has_pages == 'true' &&
        (
          github.event_name == 'workflow_dispatch' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.DOCS_MAX_PARALLEL || '5') }}
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install -e '.[dev,docs]'
      - name: Install UI test dependencies
        working-directory: yaffo_ui_tests
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: yaffo_ui_tests
        run: npx playwright install --with-deps chromium
      - name: Restore documentation fixture
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DOCS_SEED_CACHE_PATH }}
          key: ${{ needs.discover.outputs.seed_key }}
          fail-on-cache-miss: true
      - name: Build pinned documentation capture image
        working-directory: yaffo_ui_tests
        run: npm run docker:build:docs-capture
      - name: Start isolated documentation environment
        working-directory: yaffo_ui_tests
        env:
          YAFFO_DOC_OBSERVER: "1"
          YAFFO_SANDBOX_HOST: "0.0.0.0"
        run: |
          mkdir -p reports
          nohup npx tsx lib/services/isolated_runner.ts --port 5002 --preseeded --docs \
            > reports/isolated-environment.log 2>&1 &
          echo "$!" > reports/docs-server.pid

          for attempt in {1..180}; do
            if curl -fsS "$DOCS_BASE_URL" >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat reports/docs-server.pid)" 2>/dev/null; then
              echo "Isolated documentation environment exited before becoming ready."
              cat reports/isolated-environment.log
              exit 1
            fi
            sleep 1
          done
          echo "Timed out waiting for $DOCS_BASE_URL"
          cat reports/isolated-environment.log
          exit 1
      - name: Validate documentation automation
        working-directory: yaffo_ui_tests
        run: npm run docs:validate
      - name: Capture ${{ matrix.page }}
        working-directory: yaffo_ui_tests
        run: |
          # A walkthrough timeout is evidence for docs:heal, not a reason to skip it.
          # docs:capture still exits nonzero so verification gates remain strict.
          set +e
          npm run docs:capture:docker -- "${{ matrix.page }}"
          code=$?
          set -e
          echo "Initial documentation capture exit code: $code" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload initial capture evidence
        id: capture_artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-capture-${{ matrix.id }}
          path: |
            yaffo_ui_tests/.doc-staging/captures/
            yaffo_ui_tests/reports/isolated-environment.log
          if-no-files-found: warn
          retention-days: 30
      - name: Heal ${{ matrix.page }}
        id: heal-page
        working-directory: yaffo_ui_tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set +e
          npm run docs:heal -- \
            --page "${{ matrix.page }}" \
            --apply \
            --docker \
            --model "$MODEL_ALIAS"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.page }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Documentation healer exit code: $code" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish model triage to job summary
        if: ${{ always() }}
        working-directory: yaffo_ui_tests
        run: |
          TRIAGE=.doc-staging/triage.json
          if [ ! -f "$TRIAGE" ]; then
            {
              echo ""
              echo "No structured model triage was produced."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          count=$(jq '.verdicts | length' "$TRIAGE")
          if [ "$count" -eq 0 ]; then
            {
              echo ""
              echo "No model verdict was available."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for ((index=0; index<count; index++)); do
            target=$(jq -r ".verdicts[$index].target" "$TRIAGE")
            classification=$(jq -r ".verdicts[$index].triage.classification" "$TRIAGE")
            confidence=$(jq -r ".verdicts[$index].triage.confidence" "$TRIAGE")
            action=$(jq -r ".verdicts[$index].triage.recommendedAction" "$TRIAGE")
            resolved=$(jq -r ".verdicts[$index].resolved // false" "$TRIAGE")
            summary=$(jq -r ".verdicts[$index].triage.summary" "$TRIAGE")
            reasoning=$(jq -r ".verdicts[$index].triage.reasoning" "$TRIAGE")
            case "$classification" in
              intended_change) mark="✅" ;;
              walkthrough_defect) mark="🔧" ;;
              application_regression) mark="🐛" ;;
              environment_instability) mark="🌫️" ;;
              *) mark="•" ;;
            esac
            {
              echo ""
              echo "#### $mark \`$target\`"
              echo ""
              echo "- **Classification:** \`$classification\`"
              echo "- **Confidence:** $confidence"
              echo "- **Recommended action:** \`$action\`"
              if [ "$resolved" = "true" ]; then
                echo "- **Status:** repaired and verified"
              fi
              echo "- **Summary:** $summary"
              echo ""
              echo "<details><summary>Model rationale</summary>"
              echo ""
              echo "$reasoning"
              echo ""
              echo "</details>"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Capture documentation patch
        if: ${{ always() }}
        working-directory: yaffo_ui_tests
        run: |
          PAGE="${{ matrix.page }}"
          AREA="${PAGE%%/*}"
          NAME="${PAGE#*/}"
          mkdir -p patches
          git add --intent-to-add -- \
            "../docs/guide/${PAGE}.md" \
            "../docs/guide/${AREA}/assets/${NAME}" \
            "user_doc_automation/${PAGE}"
          git diff --binary -- \
            "../docs/guide/${PAGE}.md" \
            "../docs/guide/${AREA}/assets/${NAME}" \
            "user_doc_automation/${PAGE}" \
            > "patches/${{ matrix.id }}.patch"
      - name: Upload documentation patch
        id: patch_artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-patch-${{ matrix.id }}
          path: yaffo_ui_tests/patches/${{ matrix.id }}.patch
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload healing evidence
        id: healing_artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-heal-${{ matrix.id }}
          path: |
            yaffo_ui_tests/.doc-staging/triage.json
            yaffo_ui_tests/.doc-staging/heal-logs/
            yaffo_ui_tests/.doc-staging/captures/report.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Publish artifact links to job summary
        if: ${{ always() }}
        env:
          HEALING_ARTIFACT_URL: ${{ steps.healing_artifact.outputs.artifact-url }}
          PATCH_ARTIFACT_URL: ${{ steps.patch_artifact.outputs.artifact-url }}
          CAPTURE_ARTIFACT_URL: ${{ steps.capture_artifact.outputs.artifact-url }}
        run: |
          {
            echo ""
            echo "#### Artifacts"
            echo ""
            if [ -n "$HEALING_ARTIFACT_URL" ]; then
              echo "- [Healing evidence and logs]($HEALING_ARTIFACT_URL)"
            else
              echo "- Healing evidence and logs: not produced"
            fi
            if [ -n "$PATCH_ARTIFACT_URL" ]; then
              echo "- [Documentation patch]($PATCH_ARTIFACT_URL)"
            else
              echo "- Documentation patch: not produced"
            fi
            if [ -n "$CAPTURE_ARTIFACT_URL" ]; then
              echo "- [Capture evidence]($CAPTURE_ARTIFACT_URL)"
            else
              echo "- Capture evidence: not produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop isolated documentation environment
        if: ${{ always() }}
        working-directory: yaffo_ui_tests
        run: |
          if [ -f reports/docs-server.pid ]; then
            kill "$(cat reports/docs-server.pid)" 2>/dev/null || true
            wait "$(cat reports/docs-server.pid)" 2>/dev/null || true
          fi
      - name: Fail unresolved documentation work
        if: ${{ steps.heal-page.outputs.exit_code != '0' }}
        run: exit 1

  open-pr:
    name: Open documentation healing PR
    needs: [discover, heal]
    if: >-
      ${{
        always() &&
        needs.discover.outputs.has_pages == 'true' &&
        (needs.heal.result == 'success' || needs.heal.result == 'failure') &&
        (
          github.event_name == 'workflow_dispatch' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          token: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Download documentation patches
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: docs-patch-*
          path: patches
          merge-multiple: true
      - name: Apply documentation patches
        id: patches
        run: |
          shopt -s nullglob
          applied=0
          for patch in patches/*.patch; do
            [ -s "$patch" ] || continue
            git apply --binary "$patch"
            applied=$((applied + 1))
          done
          if [ "$applied" -gt 0 ] && [ -n "$(git status --porcelain -- docs/guide yaffo_ui_tests/user_doc_automation)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.patches.outputs.has_changes == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json
      - uses: actions/setup-python@v5
        if: steps.patches.outputs.has_changes == 'true'
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        if: steps.patches.outputs.has_changes == 'true'
        run: |
          python -m venv venv
          ./venv/bin/pip install mkdocs-material==9.6.21
          cd yaffo_ui_tests
          npm ci
      - name: Validate aggregated documentation changes
        if: steps.patches.outputs.has_changes == 'true'
        run: |
          cd yaffo_ui_tests
          npm run typecheck
          npm run docs:validate
          cd ..
          ./venv/bin/mkdocs build --strict
      - name: Push branch and open PR
        if: steps.patches.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto-heal/docs-${RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BODY_FILE=$(mktemp)
          {
            echo "Auto-generated user-guide updates for feature branch \`${HEAD_BRANCH}\`."
            echo ""
            echo "Each page was captured in its own isolated documentation sandbox using the pinned Playwright container."
            echo ""
            echo "Source commit: \`${HEAD_SHA}\`"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "Review the committed screenshots and the per-page \`docs-capture-*\` and \`docs-heal-*\` artifacts before merging."
          } > "$BODY_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add docs/guide yaffo_ui_tests/user_doc_automation
          git commit -m "Auto-heal user documentation"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --base "$HEAD_BRANCH" \
            --head "$BRANCH" \
            --title "Auto-heal user documentation" \
            --body-file "$BODY_FILE" \
            || gh pr edit "$BRANCH" \
              --base "$HEAD_BRANCH" \
              --title "Auto-heal user documentation" \
              --body-file "$BODY_FILE"

          gh pr list \
            --base "$HEAD_BRANCH" \
            --state open \
            --json number,headRefName \
            --jq ".[] | select(.headRefName != \"${BRANCH}\") | select(.headRefName | startswith(\"auto-heal/docs-\")) | .number" \
            | while read -r pr; do
                [ -n "$pr" ] || continue
                gh pr close "$pr" --comment \
                  "Superseded by documentation auto-heal run ${GITHUB_RUN_ID}."
              done
