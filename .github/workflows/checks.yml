name: Checks

on:
  push:
    branches: [master]
  pull_request:

# One run per ref; cancel superseded runs on new pushes.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (type-check + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # JSDoc + checkJs type-check of yaffo/static (tsc --noEmit; no build step).
      - name: Type-check JavaScript
        run: npm run typecheck:js

      # Vitest + jsdom unit tests of the first-party browser modules.
      - name: Unit tests
        run: npm run test:unit

  python:
    name: Python (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # opencv-python needs libGL / libglib at runtime on headless Linux.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # The unit-marked subset (integration/slow tests are deselected).
      - name: Unit tests
        run: pytest -m unit
