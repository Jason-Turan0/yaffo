name: Checks

on:
  pull_request:
    branches: [master]

# One run per ref; cancel superseded runs on new pushes.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + type-check + unit tests)
    runs-on: ubuntu-latest
    # Job-level permissions replace the top-level block wholesale, so
    # contents: read has to be restated alongside the checks: write that
    # test-reporter needs to publish its check run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      # JSDoc + checkJs type-check of yaffo/static (tsc --noEmit; no build step).
      - name: Type-check JavaScript
        run: npm run typecheck:js

      # Vitest + jsdom unit tests of the first-party browser modules. The junit
      # reporter runs alongside the default one, so the console output in the
      # step log is unchanged.
      - name: Unit tests
        run: npm run test:unit:cov -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - name: Publish frontend test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        # A fork PR gets a read-only token and cannot create check runs; the
        # step log still carries the failures, so never fail the job here.
        continue-on-error: true
        with:
          name: Frontend unit tests
          path: reports/vitest-junit.xml
          # Vitest emits standard JUnit XML.
          reporter: java-junit
          # The test step already failed the job on a red test; this publishes.
          fail-on-error: false
          fail-on-empty: false

      - name: Upload frontend coverage report
        id: frontend_coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: tests_js/coverage/
          if-no-files-found: warn

      - name: Add frontend coverage to job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          COVERAGE_ARTIFACT_URL: ${{ steps.frontend_coverage.outputs.artifact-url }}
        run: python scripts/coverage_summary.py javascript tests_js/coverage/coverage-summary.json --artifact-url "$COVERAGE_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  ui-test-tooling:
    name: UI test tooling (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yaffo_ui_tests/package-lock.json

      - name: Install UI test dependencies
        working-directory: yaffo_ui_tests
        run: npm ci

      - name: Unit tests under lib
        working-directory: yaffo_ui_tests
        run: npm run test:unit -- --runInBand lib

  python:
    name: Python (lint + unit tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # opencv-python needs libGL / libglib at runtime on headless Linux.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint Python
        run: ruff check yaffo

      # The unit-marked subset (integration/slow tests are deselected).
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: pytest -m unit --junitxml=reports/pytest-junit.xml

      - name: Publish Python test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: Python unit tests
          path: reports/pytest-junit.xml
          # dorny's parser for pytest's --junitxml output.
          reporter: python-xunit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload Python coverage report
        id: python_coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: python-coverage
          path: |
            htmlcov/
            coverage.xml
            reports/python-coverage.json
          if-no-files-found: warn

      - name: Add Python coverage to job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          COVERAGE_ARTIFACT_URL: ${{ steps.python_coverage.outputs.artifact-url }}
        run: python scripts/coverage_summary.py python reports/python-coverage.json --artifact-url "$COVERAGE_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
