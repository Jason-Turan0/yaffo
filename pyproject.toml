[tool.setuptools]
packages = ["yaffo"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

# Build configuration
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaffo"
dynamic = ["version"]
description = "An app to organize photos"
readme = "README.md"
authors = [{name = "Jason Turan"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = "~=3.13.0"
dependencies = [
    "anthropic",
    "openai",
    "blinker==1.9.0",
    "click==8.3.0",
    "croniter==6.2.2",
    "cachetools==7.1.4",
    "Flask==3.1.2",
    "Flask-Babel==4.0.0",
    "Flask-SQLAlchemy==3.1.1",
    "ImageHash==4.3.2",
    "insightface==1.0.1",
    "onnxruntime==1.27.0",
    "invoke==2.2.0",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "joblib==1.5.2",
    "jsonschema==4.23.0",
    "keyring",
    "MarkupSafe==3.0.2",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "pathspec==0.12.1",
    "piexif==1.1.3",
    "pillow==11.3.0",
    "pillow_heif==1.1.0",
    "platformdirs",
    "pydash",
    "PyWavelets==1.9.0",
    "requests==2.32.3",
    "rumps==0.4.0",
    "scikit-learn==1.7.2",
    "scipy==1.16.2",
    "send2trash==1.8.3",
    "setuptools==80.9.0",
    "starlark-pyo3==2026.1",
    "SQLAlchemy==2.0.43",
    "threadpoolctl==3.6.0",
    "tqdm==4.67.1",
    "typing_extensions==4.15.0",
    "waitress==3.0.2",
    "watchdog==6.0.0",
    "Werkzeug==3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "snakeviz",
    "pyinstaller==6.11.1",
    "mypy==1.18.2",
    "mypy_extensions==1.1.0",
]
docs = [
    "mkdocs-material==9.6.21",
]

[project.urls]
Homepage = "https://github.com/Jason-Turan0/yaffo"
Documentation = "https://jason-turan0.github.io/yaffo/"
Repository = "https://github.com/Jason-Turan0/yaffo"

[tool.coverage.run]
source = ["yaffo"]
branch = true
omit = [
    # Operational scripts run by hand (CLI tools, DB migrations, seed data).
    "yaffo/scripts/*",
    # Process entry point: YAFFO_ROLE dispatch + rumps menubar launch glue.
    "yaffo/__main__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
